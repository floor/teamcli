# Cursor's screen. "To resume this session:" is unknown, and the core reads
# unknown before trust. The braille range is written as characters: \u is refused.
format: 1
cli: cursor
binary: cursor-agent
process_names:
  - cursor-agent
tested:
  from: '2026.10.01'
  to: '2026.10.16'
unattended:
  - --force
  - --sandbox
  - disabled
rules: first-message
login:
  check:
    - status
  hint: cursor-agent login
exit: /exit
# The one key that empties the box, from the 2026.10.01 capture: ctrl+u returns the
# composer to its empty placeholder. ctrl+c also empties it but leaves a
# "Press Ctrl+C again to exit" row, so it is not named. Used only to clear an exit
# text that did not read back as typed, and only when the box holds exactly that text.
exit_clear: ctrl+u
# The measured way into the input box (2026-10-19, herdr 0.7.1, a 54-column pane, cursor-agent
# 2026.10.16-e3cb207): ctrl+u deleted from the end of the draft, word or row at a time, and
# repeated presses emptied the box, ending on the readable idle screen (five presses for a
# three-line draft). ctrl+c emptied it in one press but left a `Press Ctrl+C again to exit` row,
# so it is not named here; [ctrl+a, ctrl+k] stalled after one pass and was dropped. A bracketed
# paste drew the lines back exactly. mid_turn stays false: no working-turn keys were measured.
input:
  clear:
    - ctrl+u
  paste: bracketed
  mid_turn: false
# No `exit_confirm`: not observed. A 2026-10-06 run asked cursor-agent 2026.10.01-14929f9 to
# background a shell and never got past its own permission dialogs for the command, so no
# exit question with background work was ever on its pane; the CLI's /exit pair is captured
# (test/fixtures/exit-typing/) and shows no question. Nothing is declared, from no run.
timeouts:
  idle: 90s
  exit: 30s
# The predicate, label and extractor come from the registered
# cursor/2026.10.01/trust.txt capture. That capture was taken in an untrusted temporary
# directory, not the lobby, so the record claims no lobby evidence.
trust_answer:
  - from: '2026.10.01-14929f9'
    to: '2026.10.01-14929f9'
    label: '[a] Trust this workspace'
    action: '61'
    capture: cursor/2026.10.01/trust.txt
    extract:
      after: 'directory?'
      before: '[a] Trust this workspace'
      box: true
  # The same dialog on cursor-agent 2026.10.14-0f9edde (`cursor/2026.10.14/trust.txt`).
  # The marked row is still `[a] Trust this workspace` and the key is still `a`.
  - from: '2026.10.14-0f9edde'
    to: '2026.10.14-0f9edde'
    label: '[a] Trust this workspace'
    action: '61'
    capture: cursor/2026.10.14/trust.txt
    extract:
      after: 'directory?'
      before: '[a] Trust this workspace'
      box: true
  # The same dialog again on cursor-agent 2026.10.16-e3cb207 (`cursor/2026.10.16/trust.txt`):
  # the marked row is still `[a] Trust this workspace` and the key is still `a`.
  - from: '2026.10.16-e3cb207'
    to: '2026.10.16-e3cb207'
    label: '[a] Trust this workspace'
    action: '61'
    capture: cursor/2026.10.16/trust.txt
    extract:
      after: 'directory?'
      before: '[a] Trust this workspace'
      box: true
startup_reads:
  - CLAUDE.md
  - CLAUDE.local.md
  - AGENTS.md
  - .cursorrules
  - .cursor/rules/
# The team inbox registers in the seat's own `.cursor/mcp.json`: cursor-agent has no `mcp
# add` (2026.10.14 `mcp --help` lists login, list, list-tools, enable, disable), so team
# merges the server into that file. Measured on 2026.10.14-0f9edde in a scratch folder: with
# that file holding `mcpServers.team-inbox`, `cursor-agent mcp list` printed
# `team-inbox: not loaded (needs approval)`, exit 0, and `cursor-agent --help` lists
# `--approve-mcps` as "Automatically approve all MCP servers". So the launch approves the
# server it just registered. The launch refuses to write the file where the project does
# not ignore it, and leaves a file it cannot merge (a link, not JSON, not an object) as it
# is.
mcp_inbox:
  launch_args:
    - --approve-mcps
  file: .cursor/mcp.json
models:
  option:
    - --model
  # A launch that names no model starts on whatever model this CLI used last.
  absent: last-used
  ids:
    - match: '^grok-4\.7(?:-(?:xhigh|high|medium|low)(?:-fast)?|-fast)?$'
      ignore_case: true
      model: Grok
      version: '4.7'
      flag: grok-4.7-high
    - match: '^(?:cursor-)?grok-([0-9]+(?:\.[0-9]+)*)(?:-(?:xhigh|high|medium|low)(?:-fast)?|-fast)?$'
      ignore_case: true
      model: Grok
      version: '{1}'
    - match: '^gpt-5\.6-sol(?:-(?:none|low|medium|high|xhigh|max)(?:-fast)?|-fast)?$'
      ignore_case: true
      model: 'GPT Sol'
      version: '5.6'
      flag: gpt-5.6-sol-high
    - match: '^gpt-([0-9]+(?:\.[0-9]+)*)-sol(?:-(?:none|low|medium|high|xhigh|max)(?:-fast)?|-fast)?$'
      ignore_case: true
      model: 'GPT Sol'
      version: '{1}'
    - match: '^gemini-3\.8-flash(?:-(?:low|medium|high))?$'
      ignore_case: true
      model: 'Gemini Flash'
      version: '3.8'
      flag: gemini-3.8-flash-high
    - match: '^gemini-([0-9]+(?:\.[0-9]+)*)-flash(?:-(?:low|medium|high))?$'
      ignore_case: true
      model: 'Gemini Flash'
      version: '{1}'
    - match: '^composer-2\.5(?:-fast)?$'
      ignore_case: true
      model: Composer
      version: '2.5'
      flag: composer-2.5
    - match: '^composer-([0-9]+(?:\.[0-9]+)*)(?:-fast)?$'
      ignore_case: true
      model: Composer
      version: '{1}'
status_model:
  # The model is read from the composer's own status row — the line the composer selected by the
  # grammar and place below — and only from it: a grammar-looking line out of place names no
  # model, and a screen that shows no row reads no model. The rule must match the row's own line
  # whole: a known family, its version, and every token a capture shows. The version and the
  # `· N%` quota are digits in closed runs (`\d+(?:\.\d+)*`, `\d+(?:\.\d+)?%`) — `5..6` and
  # `Composer .` are not tokens — and a row missing `Run Everything` names no model.
  - match: '^  Grok\s+([0-9]+(?:\.[0-9]+)*)\b'
    model: Grok
    version: '{1}'
    # The literal model the row names; `{1}` is the version the row carries.
    yields: [Grok]
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
  - match: '^  GPT-(\d+(?:\.\d+)*) Sol(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
    model: 'GPT Sol'
    version: '{1}'
    yields: [GPT Sol]
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
  - match: '^  Gemini (\d+(?:\.\d+)*) Flash(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
    model: 'Gemini Flash'
    version: '{1}'
    yields: [Gemini Flash]
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
  - match: '^  Composer (\d+(?:\.\d+)*)(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
    model: Composer
    version: '{1}'
    yields: [Composer]
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
screen:
  unknown:
    - any: ['To resume this session:']
  trust:
    - all:
        - 'Do you trust the contents of this'
        - 'directory\?'
        - '\[a\] Trust this workspace'
        - '\[q\] Quit'
      none_after:
        anchor: 'Use arrow keys to navigate, Enter to'
        patterns:
          - '^\s*→'
          # The composer's own status row, character for character — the same expressions in all
          # three places that must recognise it.
          - '^  Grok\s+\d.*'
          - '^  Grok \d+(?:\.\d+)*(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
          - '^  GPT-\d+(?:\.\d+)* Sol(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
          - '^  Gemini \d+(?:\.\d+)* Flash(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
          - '^  Composer \d+(?:\.\d+)*(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
  # A plan-mode switch. The bar is the dialog's own rule; the title, the selected
  # row, the reject row and the footer sit under it, in that order. The same
  # words in a transcript or typed into the box are not this dialog.
  permission:
    - all:
        - '^━{8,}\s*$'
        - 'Switch to Plan mode\?'
        - '^\s*→ Approve mode switch \(y\)\s*$'
        - '^\s+Reject \(n or esc\)\s*$'
      below_last_rule: '^\s*↑/↓ to navigate • Enter to select'
      none_after:
        anchor: '^\s*↑/↓ to navigate • Enter to select'
        patterns:
          - 'Switch to Plan mode\?'
          - '→ Approve mode switch \(y\)'
          - 'Reject \(n or esc\)'
    # A shell command that is not on the allowlist, from the 2026.10.14 capture
    # (`cursor/2026.10.14/permission.txt`). The marked row is `Run (once) (y)`.
    # The plan-mode dialog above does not draw these rows.
    - all:
        - 'Run this command\?'
        - 'Not in allowlist:'
        - '→ Run \(once\) \(y\)'
        - 'Skip & tell the agent what to do instead'
  # The question tool's box: its border, the question counter, a selected option,
  # then the navigation footer, in that order. The footer words alone are not a question.
  question:
    - all:
        - '^\s*┌─+\s*┐\s*$'
        - 'Question [0-9]+ of [0-9]+'
        - '› \[ \]'
        - 'Space select ·'
        - 'Esc to skip'
        - '^\s*└─+\s*┘\s*$'
      none_after:
        anchor: 'Esc to skip'
        patterns:
          - '^\s*┌'
          - 'Question [0-9]+ of [0-9]+'
          - '› \[ \]'
          - 'Space select'
  working:
    # The running turn is the braille spinner (whatever verb it paints), the
    # prompt line ending in "ctrl+c to stop", or the follow-up queue: the box's
    # `enter …` hint row with, below it, the composer's own row — empty, or its
    # placeholder. The order is the frame's: what follows the hint row may be
    # chrome or that unpainted composer row and nothing else, so a typed row
    # under the box falls to the composer read and says unsent. A transcript
    # that quotes the box paints its prose lines there, so the queue rule reads
    # them as content and leaves the screen alone. Idle and rules-accepted
    # captures paint none of these.
    - any:
        - '^\s*→.*\s{2,}ctrl\+c to stop\s*$'
        - '^\s*[⠀-⣿]+\s+\S'
    - all:
        - '^\s*│\s*enter (?:steer|interrupt and send) · ↑ select/edit · esc cancel\s*│\s*$'
        - '^\s*→\s*(?:Add a follow-up|Plan, search, build anything)?\s*$'
      none_after:
        anchor: '^\s*│\s*enter (?:steer|interrupt and send) · ↑ select/edit · esc cancel\s*│\s*$'
        patterns:
          - match: '^\s*\S'
            except:
              - '^\s*[│┌└─┐┘├┤]'
              - '^\s*[⠀-⣿]'
              - '^\s*Tip:'
              - '^\s*→\s*(?:Add a follow-up|Plan, search, build anything)?\s*$'
              - '^  Grok\s+\d.*'
              - '^  Grok \d+(?:\.\d+)*(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
              - '^  GPT-\d+(?:\.\d+)* Sol(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
              - '^  Gemini \d+(?:\.\d+)* Flash(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
              - '^  Composer \d+(?:\.\d+)*(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
              - '^\s*<workspace>'
              - '^\s*~/'
              - '^\s*❯'
  composer:
    mode: status-then-one
    # The status row is its shape, and its tokens are closed: exactly two spaces, then a known
    # family and its version — Grok N, GPT-N Sol, Gemini N Flash, Composer N — then only tokens
    # the captures show: a context size (256K, 272K), an effort word (the ones --list-models
    # prints and the captures paint), the `· N%` quota, `· N files edited`, then padding and, for
    # the new families, `Run Everything`, which every captured idle, unsent and working row
    # carries. Every number is digits in closed runs — version \d+(?:\.\d+)*, quota
    # \d+(?:\.\d+)?%, files \d+ — and nothing else may appear on the line; a row the grammar
    # does not know leaves the screen unknown. One expression covering all four families with
    # closed tokens is 227 characters and the dialect refuses anything past 200, so the patterns
    # are a list, read as the union: a line is a candidate when it matches any entry.
    #
    # The row's place is pinned too: the line directly under it is the workspace line the pane
    # draws (`  <workspace>` in the fixtures — the captures' paths replaced — `  ~/…` or
    # `  /…` live), that line must be the pane's last non-blank one, and the `  →` input row
    # sits above the row within the distance the captures show (three to five rows; the core's
    # bound). A grammar-looking line anywhere else is ordinary text: it opens no fallback, it is
    # never the row, and it leaves the screen unknown. A grammar line with no workspace line
    # under it reads no row at all.
    #
    # Grok rows are the exception (`except`): main read any `  Grok <digit>` tail wherever it
    # sat, and the follow-up-queue captures — transcribed rather than captured — draw Grok rows
    # without `Run Everything`; pinning those rows' place would move readings main makes and
    # every shipped Grok fixture keeps. The new families' rows have only ever been seen in
    # place, so they carry the place test. The same four expressions are used, character for
    # character, in the trust dialog's none_after and in the working queue's exception, so the
    # three places that decide whether a line is the status row cannot disagree.
    status_line:
      - '^  Grok\s+\d.*'
      - '^  Grok \d+(?:\.\d+)*(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
      - '^  GPT-\d+(?:\.\d+)* Sol(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
      - '^  Gemini \d+(?:\.\d+)* Flash(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
      - '^  Composer \d+(?:\.\d+)*(?: 256K| 272K)?(?: (?:None|Minimal|Low|Medium|High|Extra High|Max))?(?: · \d+(?:\.\d+)?%)?(?: · \d+ files edited)?  +Run Everything$'
    status_below:
      line: '^  (?:<workspace>|~?/)'
      except: '^  Grok\s+\d'
    # The input row carries the prompt at the pane's second column — unsent.txt and
    # follow-up-queue-typed.txt draw `  → Plan, search, build anything` there, continuations at
    # the fourth — and a prompt glyph on a content or popup row is never the input row. The
    # read scans up from the status line and anchors this pattern to the captured column.
    prompt: '^ {2}→'
    strip_suffix: '\s*ctrl\+c to stop\s*$'
    # Cursor greys its placeholder with faint styling and draws its cursor as one inverse cell on
    # the placeholder's first character, while typed text carries neither
    # (exit-typing/cursor-idle-ansi.txt, cursor-unsent-ansi.txt). The list stays the fallback for
    # a source without styling.
    placeholder_style: dim
    placeholders:
      - equals: ''
      - equals: Plan, search, build anything
      - equals: Add a follow-up
    # A line wider than the pane's content column continues on the next row at the text
    # column, broken at a space: unsent.txt is its sentence word-wrapped this way on a
    # 51-column pane, and the box is compared with the typed text before any Enter. Only
    # the whitespace the row break itself stands for is normalised — the run the break was
    # made at, or a blank line the text itself has; inside a row, every character must
    # match, runs of spaces included.
    wrap:
      continuation: text-column
      kind: word
    # unsent.txt and follow-up-queue-typed.txt show two empty rows under the text, between
    # it and the status line: the drop the pane draws of its own, inside the box's frame.
    # The box read strips up to two trailing empty rows as that frame; a row beyond them is
    # one the typed text does not have.
    frame_rows: 2
    # The background-task count the pane draws of its own between the empty
    # placeholder and the status row. Captured 2026-10-12 on cursor-agent
    # 2026.10.01-14929f9 in a 54-column pane (scratch session, not a live seat):
    # one blank row, then `  1 task` or `  2 tasks`, then the status row. The
    # box itself held only `→ Add a follow-up`. That row is not unsent text.
    own_rows:
      - '^  [0-9]+ tasks?$'
    # The box's own border, as the captures of 2026-10-05 draw it: one row of `▄` directly
    # above the input row and one row of `▀` directly below the input rows, both whole rows
    # at the pane's width, with the status row directly under the bottom one. In every real
    # frame seen (observed 2026-10-05 with cursor-agent 2026.10.01-14929f9 across three widths:
    # 53 columns with border rows 52 and status row 51; ~152 columns with border rows 151 and
    # status row 150; 173 columns with border rows 172 and status row 171), the border row is
    # exactly one character longer than the status row (`border length === status row length + 1`).
    # The 2026-10-01 captures draw the empty frame above instead; both frames are read, and the
    # border is never read apart from its place — the rule language pins the status row's place
    # (`status_below`) but nothing pinned rows against the input row, so this field names the two
    # rows and the core reads their place: directly above the input row, directly below the input
    # rows and directly above the status row. A frame with one row missing, a row one row away, a
    # row carrying anything but the block character, a border row inside the box, or a border row
    # not exactly one character longer than the status row leaves the screen unknown.
    border:
      top: '^ ▄+$'
      bottom: '^ ▀+$'
    fallback:
      - all:
          - match: '^\s*→\s+\S'
            except: ['\sExit\s*$']
          - '^\s*→?\s*/\S+\s+Exit\s*$'
        kind: unsent
