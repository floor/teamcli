# Codex's screen. An empty box is idle, as the old classifier treated it; the
# grey suggestion is the other placeholder.
format: 1
cli: codex
binary: codex
process_names:
  - codex
tested:
  from: '0.157.0'
  to: '0.161.0'
unattended:
  - -a
  - never
  - -s
  - danger-full-access
  - --no-alt-screen
rules: first-message
login:
  check:
    - login
    - status
  hint: codex login
exit: /exit
# The one key that empties the box, from the 0.160.0 capture: ctrl+u returns the
# composer to its empty placeholder. Used only to clear an exit text that did not read
# back as typed, and only when the box holds exactly that text.
exit_clear: ctrl+u
# The measured way into the input box (2026-10-19, herdr 0.7.1, a 55-column pane, codex-cli
# 0.161.0): one ctrl+u removed the draft's last row; the pair [ctrl+u, ctrl+k] cleared one row per
# pass and left the box empty after the passes its rows counted (four for a three-line draft; the
# extra pass harmless). A bracketed paste drew the lines back unchanged. Codex showed no composer
# while a turn ran, so no keys were measured there: mid_turn stays false.
input:
  clear:
    - ctrl+u
    - ctrl+k
  paste: bracketed
  mid_turn: false
# No `exit_confirm`: a 0.160.0 run on 2026-10-06 left a backgrounded shell running, sent
# `/exit`, and one Enter put the pane back at its shell with no question asked — its exit
# printed only advice ("Stop the current turn: run codex agents, select this task, and press
# x."). There is no exit question to confirm, so none is declared.
timeouts:
  idle: 90s
  exit: 30s
# The folder-only layout, from the registered codex/0.157.0/trust-folder.txt capture: the
# path is wrapped at column 51, continuing at indent 2. Codex is eligible only when the
# record also names `lobby_evidence`, a capture of the same dialog in the real lobby; none
# is registered, so this record answers nothing yet.
trust_answer:
  - from: '0.157.0'
    to: '0.157.0'
    label: '1. Trust and continue'
    action: '31'
    capture: codex/0.157.0/trust-folder.txt
    extract:
      after: 'Folder access'
      until_blank: true
      join: true
      indent: 2
      wrap: 51
      refuse_line: 'Trusting will apply to the repository root:'
startup_reads:
  - AGENTS.md
  - .codex/config.toml
# The team inbox registers on the launch line and writes no file. A run in a scratch
# CODEX_HOME: `codex mcp list --json` printed `[]`; the same command with
# `-c 'mcp_servers.team_inbox.command="team"' -c 'mcp_servers.team_inbox.args=["mcp",
# "serve","--seat","helper"]'` listed `team_inbox`, `"enabled": true`,
# `"transport": {"type": "stdio"}`, that command and args array, and left the scratch
# CODEX_HOME empty. `-c, --config <key=value>` is documented as "Override a configuration
# value ... dotted path ... parsed as TOML". The runner is this install's own executable and
# entry script, so the server starts whether or not `team` is on the PATH; the session is
# the team file's in the seat's folder, which the server reads itself (send reads it too).
mcp_inbox:
  launch_args:
    - -c
    - 'mcp_servers.team_inbox.command="{command_json}"'
    - -c
    - 'mcp_servers.team_inbox.args=["{entry_json}","mcp","serve","--seat","{seat_json}"{file_args}{epoch_args}]'
models:
  option:
    - -m
    - --model
  ids:
    - match: '^gpt-([0-9]+(?:\.[0-9]+)?)-(astra|sol|luna|terra)$'
      ignore_case: true
      model: 'GPT {2:title}'
      version: '{1}'
quota:
  - account: openai
    match: '\bweekly ([0-9]+)% left\b'
    left: '{1}%'
    window: weekly
status_model:
  - match: '^\s+GPT-([0-9]+(?:\.[0-9]+)?)-([Aa][Ss][Tt][Rr][Aa]|[Ss][Oo][Ll]|[Ll][Uu][Nn][Aa]|[Tt][Ee][Rr][Rr][Aa])\s[^·]*·'
    model: 'GPT {2:title}'
    version: '{1}'
    # The four families the capture knows; `{2:title}` spells each in its title case.
    yields: [GPT Astra, GPT Sol, GPT Luna, GPT Terra]
    version_like: '^[0-9]+(?:\.[0-9]+)?$'
  # A later footer that is not one of those four names is unread, as the old id map was.
  # The `{1}` names a group this pattern does not have, on purpose: a template that cannot
  # fill reads the line as naming no model. There is no plainer spelling — an empty string
  # is refused and a literal would read as a found model, not as unread. The rule declares
  # the emptiness: it yields nothing and spells no version, and that is its whole reading.
  - match: '^\s+GPT-[0-9][\w.-]*\s[^·]*·'
    model: '{1}'
    version: '{1}'
    yields: []
# Codex's daemon dialog, drawn at startup before any session exists ('Background server has
# incompatible feature settings', options 1 run without daemon / 2 restart / 3 cancel). Nothing
# ran in the pane yet, so `team down` closes it without typing: no option is ever chosen, and
# never 2, which would restart the shared background server.
not_started:
  - all:
      - 'Background server has incompatible feature settings'
      - '^\s*›?\s*1\. Run without daemon this time'
      - '^\s*›?\s*2\. Restart with these settings'
screen:
  unknown:
    - any: ['\bmodel:\s+loading\b']
  trust:
    - all:
        - 'Trust this folder\?'
        - '^\s*›?\s*1\. Trust and continue\s*$'
      footer: 'enter continue · esc quit'
    # 0.161.0 renamed the way out: `2. Back to Agent Command Center` and the footer's
    # `esc back` (0.161.0/trust.txt). The question above it is the same, so it is still trust.
    - all:
        - 'Trust this folder\?'
        - '^\s*›?\s*1\. Trust and continue\s*$'
      footer: 'enter continue · esc back'
  permission:
    - all:
        - '^\s*Would you like to run the following command\?\s*$'
        - '^\s*›?\s*1\. Yes, proceed \(y\)\s*$'
        - '^\s*›?\s*2\. No, and tell Codex what to do differently \(esc\)\s*$'
      footer: 'Press enter to confirm or esc to cancel'
    # 0.161.0 adds a "Yes, and don't ask again" row, which moves the No row to 3
    # (0.161.0/permission.txt). The command it names wraps, so only the row's fixed words are
    # pinned; the footer and the first two rows are the older dialog's own.
    - all:
        - '^\s*Would you like to run the following command\?\s*$'
        - '^\s*›?\s*1\. Yes, proceed \(y\)\s*$'
        - '^\s*›?\s*2\. Yes, and don''t ask again for commands that start'
        - '^\s*›?\s*3\. No, and tell Codex what to do differently \(esc\)\s*$'
      footer: 'Press enter to confirm or esc to cancel'
  # Codex's own update screen, drawn at startup before any composer (startup.txt, 0.157.0).
  # A vendor notice, not a question the agent asked: never answered, and the `tested` range
  # says the version the capture was taken on. Codex has no `question` stage: a screen that
  # reads as one is a dialog, and a dialog is never a vendor notice.
  vendor_notice:
    tested:
      from: '0.157.0'
      to: '0.157.0'
    rules:
      - all:
          - 'Update available ·'
          - '^\s*›?\s*1\. Update now\b'
        footer: 'enter continue · esc skip'
  rate_limit:
    # The exhaustion wording, from Codex's own upstream source at the tested tags — the
    # usage-limit errors its turn renders as a transcript error cell: the 429 `Quota exceeded.
    # Check your plan and billing details.`, the plan messages `You’ve hit your usage limit …
    # try again at …`, and the CLI's own `Usage limit reached. You've reached your usage
    # limit.` No pane capture of an exhausted Codex seat exists, so every test frame is
    # synthetic. The cell is a transcript row above the prompt, so `at_composer` reads the block
    # of matching rows directly above the box: a sentence quoted inside a turn is not the wall,
    # and a frame the TUI wraps past that block stays unread rather than match somewhere else.
    # The reset follows `try again at`; the source formats a
    # local clock (`3:05 PM`, `Oct 23rd, 2026 3:05 PM`), printed as the screen words it. The
    # near-cap warning (`less than N% of your… limit left`) is not exhaustion: it is never
    # this stage.
    - any:
        - 'Quota exceeded\. Check your plan and billing details\.'
        - 'You(?:’|'')ve hit your usage limit'
        - 'Usage limit reached\. You(?:''|’)ve reached your usage limit\.'
      live: true
      at_composer: true
  working:
    - any: ['esc to interrupt']
  composer:
    # 0.161.0 draws one chrome row under the status row — `← for agents · ? for shortcuts`,
    # or the same with the warning count (`? for shortcuts … ⚠ 1 warning · f2 to view`) —
    # outside the YOLO launch a seat gets, and the row is hidden again while text is typed
    # (0.161.0/idle-hint.txt, unsent.txt, working.txt). A `status-last` read called every
    # such screen unknown and the seat's rules were never typed; the one-row mode reads it.
    mode: status-then-one
    status_line: '^\s+GPT-[0-9][\w.-]*\s+[^·]*·'
    # 0.161.0 at 54 columns wraps the status row: `weekly 9` stays on the status line and
    # the next line is the ellipsis alone. A status line that already holds `…`, an `L:`
    # quota, or that ends `% left` or `% used` keeps the last-line reading, and so does one
    # that ends with the account's `⚠ N warning · f2 to view` tail: 0.161.0 draws the context
    # either way — `Context 100% left` or `Context 100% used` are both its own status surfaces
    # (`context-remaining` and `context-used`) — and a seat at its idle prompt with the used
    # figure was read `unknown`, so `restart` called the already-fresh seat not ready. A wide
    # pane right-aligns that warning on the status row itself and draws no chrome row under it
    # (idle-wide-warning.txt), so the tail is part of the row and never the ellipsis row the
    # wrap expects. The wrap is the status row only when the line under it is that ellipsis and
    # nothing follows it.
    status_below:
      line: '^…\s*$'
      except: '…|L:|% (?:left|used)$|⚠ \d+ warnings?\s*·\s*f2 to view\s*$'
    # The pane's own row under the status line, and the whole of what may stand there: the
    # captures draw `← for agents · ? for shortcuts` (0.161.0/idle-hint.txt, working.txt), and
    # the same hint carries the account's warning on it — `? for shortcuts … ⚠ N warning · f2 to
    # view`, the `⚠ N warning · f2 to view` tail the 0.157.0 captures draw on the status row.
    # The `← for agents · ` prefix is optional on both forms: it is the plain row's own, and a
    # warning or a width may draw the hint without it, or with it beside the warning. Anything
    # else below a status row is the seat's own text, and the row above it is not the composer's:
    # a seat cannot print a status-shaped line and a figure and have the watch read it
    # (test/quota.test.ts).
    chrome:
      - '^\s*(?:← for agents · )?\? for shortcuts\s*$'
      - '^\s*(?:← for agents · )?\? for shortcuts\s*…\s*⚠ \d+ warnings?\s*·\s*f2 to view\s*$'
    # The input row carries the prompt at the pane's first column — unsent.txt draws `› Rules.`
    # there, content on the rows below at the second, and exit-typed.txt keeps the old
    # transcript and menu rows above it — and a prompt glyph on a content row is never the
    # input row. The read scans up from the status line and anchors this pattern to the
    # captured column. An observed build draws the same ready screen with `»` in place of `›`
    # (GPT-6.1-Sol ultra); the two glyphs are the one prompt, and a row carrying either at
    # that column is the input row.
    prompt: '^[›»](?:\s|$)'
    # No captured Codex frame draws its box without a status row, so there is nothing the
    # fallback may call idle or unsent. An empty list is a declared one: a screen with no
    # status row stays unknown.
    fallback: []
    # Codex greys its placeholder — `Ask Codex to do anything` here, other words in other
    # sessions — with faint styling after a bold prompt, while typed text carries none
    # (exit-typing/codex-idle-ansi.txt, codex-unsent-ansi.txt). The list stays the fallback for
    # a source without styling.
    placeholder_style: dim
    placeholders:
      - equals: ''
      - equals: Ask Codex to do anything
    # unsent.txt and exit-typed.txt show one empty row under the text, between it and the
    # status line: the drop the pane draws of its own, inside the box's frame. The box read
    # strips up to one trailing empty row as that frame; a row beyond it is one the typed
    # text does not have.
    frame_rows: 1
