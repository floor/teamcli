# Antigravity's screen. Trust and permission are case-insensitive. The slash
# menu's arrow line and the esc footer are chrome, so exit-typed stays unsent.
#
# Resume, measured on the owner's Mac: `agy --conversation=<uuid>` resumes that
# conversation. Example: `agy --conversation=b4b1b021-e8af-4213-9b7e-470b233b712f`.
# Conversations live under ~/.gemini/antigravity-cli/conversations/. TeamCLI appends
# one `--conversation=<id>` word to the seat's launch line, from the registry record's
# reach.agent_session. A wrapper such as `zsh .../as-floor.sh agy ...` keeps the flag
# on that same line so the wrapper forwards it; a quoted script that itself runs agy
# (`zsh -lc "agy ..."`) gets the flag inside the quotes. This profile does not mint
# the id at launch.
format: 1
cli: antigravity
binary: agy
process_names:
  - agy
tested:
  from: '1.2.16'
  to: '1.4.2'
unattended:
  - --dangerously-skip-permissions
rules: first-message
login:
  check:
    - models
  hint: agy
exit: /exit
# One ctrl+u empties the composer. On 1.3.5, with the rules line unsent,
# one ctrl+u restored the idle prompt and the shortcuts footer, and the
# CLI stayed up (herdr 0.7.1, pane send-keys, stty size 23 53).
exit_clear: ctrl+u
timeouts:
  idle: 90s
  exit: 30s
# The predicate, label and extractor come from the registered
# antigravity/1.2.16/trust.txt capture. That capture was taken in a fresh untrusted
# temporary directory, not the lobby, so the record claims no lobby evidence.
trust_answer:
  - from: '1.2.16'
    to: '1.2.16'
    label: 'Yes, I trust this folder'
    mark: '>'
    footer: 'enter Confirm'
    action: '0d'
    capture: antigravity/1.2.16/trust.txt
    extract:
      after: 'Accessing workspace:'
      before: 'Do you trust the contents of this project?'
  # The same dialog on 1.3.5 (`antigravity/1.3.5/trust.txt`): the marked row is still
  # `Yes, I trust this folder`, Enter still confirms, and the path still sits between
  # `Accessing workspace:` and the question. The footer gained `↑/↓ Navigate ·` in front
  # of `enter Confirm`. The model row under it read `Gemini 4 Argon · medium`.
  - from: '1.3.5'
    to: '1.3.5'
    label: 'Yes, I trust this folder'
    mark: '>'
    footer: 'enter Confirm'
    action: '0d'
    capture: antigravity/1.3.5/trust.txt
    extract:
      after: 'Accessing workspace:'
      before: 'Do you trust the contents of this project?'
  # The same dialog again on 1.4.0 and 1.4.1 (`antigravity/1.4.1/trust.txt`): the marked row is
  # still `Yes, I trust this folder`, Enter still confirms, and the path still sits between
  # `Accessing workspace:` and the question. The footer still reads `↑/↓ Navigate · enter Confirm`.
  # 1.4.1 adds the model row `Gemini 4 Argon · medium` under the footer; the question itself and
  # the box's rows are unchanged.
  - from: '1.4.0'
    to: '1.4.1'
    label: 'Yes, I trust this folder'
    mark: '>'
    footer: 'enter Confirm'
    action: '0d'
    capture: antigravity/1.4.1/trust.txt
    extract:
      after: 'Accessing workspace:'
      before: 'Do you trust the contents of this project?'
  # The same dialog again on 1.4.2 (`antigravity/1.4.2/trust.txt`): the marked row, the footer
  # and the path's place between `Accessing workspace:` and the question are unchanged. The model
  # row 1.4.1 drew under the footer is gone again, as it was on 1.4.0.
  - from: '1.4.2'
    to: '1.4.2'
    label: 'Yes, I trust this folder'
    mark: '>'
    footer: 'enter Confirm'
    action: '0d'
    capture: antigravity/1.4.2/trust.txt
    extract:
      after: 'Accessing workspace:'
      before: 'Do you trust the contents of this project?'
startup_reads:
  - AGENTS.md
  - GEMINI.md
models:
  option:
    - --model
  ids:
    - match: '^gemini-([0-9]+(?:\.[0-9]+)?)-(flash|pro|argon)(?:-(high|medium|low))?$'
      ignore_case: true
      model: 'Gemini {2:title}'
      version: '{1}'
status_model:
  - match: '(?:^|[\s·|])Gemini\s+([0-9]+(?:\.[0-9]+)*)\s+(Flash|Pro|Argon)\b'
    ignore_case: true
    model: 'Gemini {2:title}'
    version: '{1}'
    # The families the capture knows, whatever case the row spells them in; `{2:title}`
    # reads each back in title case. Argon is the 1.3.5 idle footer `Gemini 4 Argon · medium`.
    yields: [Gemini Flash, Gemini Pro, Gemini Argon]
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
screen:
  chrome:
    - '^\s*↑/↓ Navigate.*$'
    - '^esc to cancel\s+Gemini\s+[0-9].*$'
  trust:
    ignore_case: true
    rules:
      - all:
          - 'Do you trust the contents of this project\?'
          - '>\s*Yes, I trust this folder'
        below_last_rule: 'enter Confirm'
      # The captured trust dialog fills the pane: there is no composer rule.
      - all:
          - 'Do you trust the contents of this project\?'
          - '>\s*Yes, I trust this folder'
          - 'enter Confirm'
        without_rule: true
  permission:
    ignore_case: true
    rules:
      - all:
          - 'Requesting permission for:'
          - '^\s*>\s*[0-9]\.\s+Yes\b'
        below_last_rule: '↑/↓ Navigate'
      # A long command pushes the one rule out of the window. The dialog is the
      # three lines, with no composer rule left to sit below.
      - all:
          - 'Requesting permission for:'
          - '^\s*>\s*[0-9]\.\s+Yes\b'
          - '↑/↓ Navigate'
        without_rule: true
      # The file-creation prompt, as permission-write-54.txt draws it: the question line and
      # its two numbered options below the dialog's own rule, the navigation footer under
      # them all. The same words in a transcript sit above the box's closing rule, so the
      # footer below the last rule is the dialog's, never a quote's.
      - all:
          - 'Allow creation of this file\?'
          - '^\s*>\s*1\.\s+Yes, allow creation\b'
          - '^\s*2\.\s+No, deny creation\b'
        below_last_rule: '↑/↓ Navigate'
      # The file-edit prompt, as permission-edit-54.txt draws it, in the same frame.
      - all:
          - 'Accept this file edit\?'
          - '^\s*>\s*1\.\s+Yes, accept this change\b'
          - '^\s*2\.\s+No, reject this change\b'
        below_last_rule: '↑/↓ Navigate'
  question:
    # The question tool's choice screen, as question-54.txt draws it: the Question 1/1 line
    # and its option rows (the first marked, Write-in... the last) below the dialog's own
    # rule, the select footer under them all. A quoted question in a transcript is above
    # the box's closing rule, so the footer below the last rule is the dialog's.
    - all:
        - '\bQuestion [0-9]+/[0-9]+:'
        - '^\s*>\s*1\.\s'
        - '\bWrite-in\.\.\.'
      below_last_rule: '↑/↓ Navigate · enter Select'
    # The Unsent Comments dialog, as question-unsent-54.txt draws it: no rule in the window.
    # A bare input row after the anchor makes the words a transcript above the composer.
    - all:
        - 'You have unsent comments\. Ready to send\?'
        - 'y send and exit · n exit without sending'
      without_rule: true
      none_after:
        anchor: 'You have unsent comments\. Ready to send\?'
        patterns:
          - '^>\s*$'
  rate_limit:
    # A usage wall reported from the field (2026-10-21): the pane read `Individual quota
    # reached`, with a reset span under it (`Resets in 47h31m`). No capture of the frame
    # exists, so the placement is not invented: `at_composer` reads the block directly above
    # the box as one block, every row of it matching the rule (a printed reset value wrapped
    # onto its own row under the sentence is the one continuation the reader allows). The
    # reported frame is the two
    # rows below (sentence, then reset) over the box's blank margin, and a screen that names
    # no reset is the one-row form; the second rule reads that one without requiring a reset.
    # A sentence quoted inside a turn, with later text between it and the box, is not the
    # wall. A frame that draws the notice elsewhere stays unread — the known limitation until
    # a sanitized capture arrives. The reset is printed as the screen words it; a screen
    # naming none is an explicit unknown, never an invented time.
    - all:
        - '\bIndividual quota reached\b'
        - '\bResets in\s+[^│|]+'
      live: true
      at_composer: true
    - all:
        - '\bIndividual quota reached\b'
      live: true
      at_composer: true
  working:
    - any:
        # Generation indicator
        - '\bGenerating\.\.\.'
        # Whole braille block with optional leading spaces (thinking preview & tool spinners)
        - '^\s*[⠀-⣿]'
        # Command execution (supports leading spinner or bare prompt)
        - '\bRunning command\.\.\.'
        # Active tool execution
        - '^\s*●\s+Running\b'
  composer:
    mode: two-rules-footer-below
    ignore_case: true
    # The input row is the box's first row under its opening rule, carrying the prompt at the
    # pane's first column — unsent.txt draws `> Rules...` there, content at the second — and a
    # prompt glyph on a continuation row is content, never the input row. The reader anchors
    # this pattern to the captured column.
    prompt: '^>\s*'
    # Both rules are unbroken runs of ─ from the pane's first column (unsent.txt draws them at
    # rows 7 and 12). A rule-looking row the box holds is drawn at the content column and is
    # content, never the frame.
    rule: '^[─━]{8,}\s*$'
    # A long paste folds: the row reads `↑ N more lines` (with the prompt glyph on the
    # input row's own marker), the rows below it are the tail. Capture 1 is N.
    fold: '^\s*(?:>\s*)?↑\s*([0-9]+)\s+more lines\s*$'
    footers:
      - '\? for shortcuts'
      - 'Gemini\s+[0-9]'
      - 'esc to cancel'
      - '>\s*/exit\s+Exit'
    placeholders:
      - equals: ''
