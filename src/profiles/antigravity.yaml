# Antigravity's screen. Trust and permission are case-insensitive. The slash
# menu's arrow line and the esc footer are chrome, so exit-typed stays unsent.
#
# Resume, measured on the owner's Mac: `agy --conversation=<uuid>` resumes that
# conversation. Example: `agy --conversation=b4b1b021-e8af-4213-9b7e-470b233b712f`.
# Conversations live under ~/.gemini/antigravity-cli/conversations/. TeamCLI appends
# one `--conversation=<id>` word to the seat's launch line, from the registry record's
# reach.agent_session. A wrapper such as `zsh .../as-floor.sh agy ...` keeps the flag
# on that same line so the wrapper forwards it; a quoted script that itself runs agy
# (`zsh -lc "agy ..."`) gets the flag inside the quotes. This profile does not mint
# the id at launch.
format: 1
cli: antigravity
binary: agy
process_names:
  - agy
tested:
  from: '1.2.16'
  to: '1.4.2'
unattended:
  - --dangerously-skip-permissions
rules:
  launch_prompt: --prompt-interactive
# The trust dialog is pre-answered for the seat's own launch folder. A run on 1.4.12 measured,
# in a fresh never-answered folder, that `--dangerously-skip-permissions` alone still draws
# "Do you trust the contents of this project?", that `agy --help` has no trust flag, and that
# `--settings '{"trustedWorkspaces":["<absolute path>"]}'` opens straight at the banner and
# composer: no dialog. The value is one inline JSON object, session-only and never saved
# (`--help` says "Settings for this session only, never saved"), and its validation is strict:
# an array of absolute paths is accepted; `true` and an object map are refused. `{cwd}` is the
# seat's absolute launch folder, filled by the launch.
settings:
  option: --settings
  value: '{"trustedWorkspaces":["{cwd}"]}'
# The inbox registers in the CLI's own user-level store (under the seat's HOME, which every team
# on the machine shares), so the entry is named per seat — `{inbox}` is
# team-inbox-<session>-<seat>-<hash>, the hash of the exact pair keeping two pairs that fold to
# the same readable part apart — and never replaces another entry. A run on 1.4.12 measured:
# `agy mcp add <name> ...` adds or updates exactly that entry and keeps every other one;
# `agy mcp remove <name>` removes exactly that one and keeps the rest (the owner's
# `floor-committee` entry stayed); removing a name that is not there exits 1 with
# `Error: MCP server "<name>" not found`. The add's flags go before the name; arguments after
# the command pass through unparsed, including `--seat`, `--session`, `--file` and `--epoch`.
mcp_inbox:
  add:
    - mcp
    - add
    - '{inbox}'
    - '{command}'
    - '{entry}'
    - mcp
    - serve
    - --seat
    - '{seat}'
    - --session
    - '{session}'
    - '{file}'
    - '{epoch}'
  remove:
    - mcp
    - remove
    - '{inbox}'
# The class the launch installs: the inbox above is read when the model takes a turn, so an idle
# seat is pull-only (the class grok, cursor and gemini also declare).
delivery: pull-on-turn
# The typed wake, granted 2026-11-02 on the 1.4.12 frames in test/fixtures/antigravity/1.4.12/:
# a send may type one trigger line into a composer two reads showed as the empty idle prompt,
# presses Enter only while the box still holds exactly that line, and calls itself delivered only
# when the `working` screen (the braille spinner row, `⣾  Reading file...` or `Generating...`)
# appears. The screens are captured whole, including the `Conversation compacted` transcript
# under the same box. The box-holding frames are refusals: a draft the owner left, and the
# `/exit` completion frame, whose box holds `/exit` while the completion row sits below the
# closing rule. Nothing else is typed, and a wake that cannot deliver leaves the message in the
# bus inbox. See src/send/typed-wake.ts.
typed_wake: screen
# The words the wake appends so the woken turn goes straight to the seat's fastest read path: the
# inbox registered above. `inbox_check` is the one direct call — it lists the waiting messages
# with their ids — and `inbox_read`, whose argument is the id inbox_check returned
# (src/mcp/serve.ts), reads one and marks it read. The typed line never carries the message id,
# so naming inbox_read alone would earn a refused call.
read_hint: 'Read it with: call inbox_check now.'
login:
  check:
    - models
  hint: agy
exit: /exit
# One ctrl+u empties the composer. On 1.3.5, with the rules line unsent,
# one ctrl+u restored the idle prompt and the shortcuts footer, and the
# CLI stayed up (herdr 0.7.1, pane send-keys, stty size 23 53).
exit_clear: ctrl+u
timeouts:
  idle: 90s
  exit: 30s
# The dialog dismiss key the project's own captures recorded, the footer's skip key pressed in
# a scratch session and the dialog left without an answer, on every captured version whose own
# `agy --version` print is saved: `1.3.5/question.txt`, `1.4.0/question.txt`, `1.4.1/question.txt`
# and `1.4.2/question.txt`, each "Escape dismissed it". Only those versions are listed, one exact
# record each: a range would press a key on a version no run pressed it on. No record claims
# 1.2.16: `1.2.16/question-54.txt` records "Escape dismissed it; no option was chosen", but that
# folder only names its build and saves no `agy --version` print, so the printed spelling would
# be inferred — the prints are saved from 1.3.5 on. The unsent-comments confirmation
# (`1.2.16/question-unsent-54.txt`) was closed rather than dismissed, so it claims no key.
question_answer:
  - kind: question
    key: escape
    from: '1.3.5'
    to: '1.3.5'
  - kind: question
    key: escape
    from: '1.4.0'
    to: '1.4.0'
  - kind: question
    key: escape
    from: '1.4.1'
    to: '1.4.1'
  - kind: question
    key: escape
    from: '1.4.2'
    to: '1.4.2'
# No record for `1.2.16`: its captures (`antigravity/1.2.16/trust.txt`, `trust-54.txt`) show
# the workspace trust dialog, and none answered it — the README records "The workspace was
# closed without answering the question" and `trust-54.txt` "Escape was the only answer
# given". A record that sends a key names one captured version that a run answered, so there
# is none here: a seat printing 1.2.16 is refused as a version with no trust answer rather
# than pressed on a key no run pressed.
# The predicate, label and extractor come from the registered
# antigravity/1.3.5/trust.txt capture, whose README records `idle.txt` as "the same directory
# after Enter on the marked trust row". That capture was taken in a fresh untrusted
# temporary directory, not the lobby, so the record claims no lobby evidence.
trust_answer:
  # The same dialog on 1.3.5 (`antigravity/1.3.5/trust.txt`): the marked row is still
  # `Yes, I trust this folder`, Enter still confirms, and the path still sits between
  # `Accessing workspace:` and the question. The footer gained `↑/↓ Navigate ·` in front
  # of `enter Confirm`. The model row under it read `Gemini 4 Argon · medium`.
  - from: '1.3.5'
    to: '1.3.5'
    label: 'Yes, I trust this folder'
    mark: '>'
    footer: 'enter Confirm'
    action: '0d'
    capture: antigravity/1.3.5/trust.txt
    extract:
      after: 'Accessing workspace:'
      before: 'Do you trust the contents of this project?'
  # The same dialog on 1.4.0 (`antigravity/1.4.0/trust.txt`): the marked row is still
  # `Yes, I trust this folder`, Enter still confirms — its `idle.txt` is the same directory after
  # Enter on the marked row — and the path still sits between `Accessing workspace:` and the
  # question. The footer reads `↑/↓ Navigate · enter Confirm`. The version is exact, like every
  # record that sends a key: a version no capture shows is never claimed by a range.
  - from: '1.4.0'
    to: '1.4.0'
    label: 'Yes, I trust this folder'
    mark: '>'
    footer: 'enter Confirm'
    action: '0d'
    capture: antigravity/1.4.0/trust.txt
    extract:
      after: 'Accessing workspace:'
      before: 'Do you trust the contents of this project?'
  # The same dialog again on 1.4.1 (`antigravity/1.4.1/trust.txt`): the marked row, the footer
  # and the path's place are unchanged, and its `idle.txt` is the directory after Enter on the
  # marked row. 1.4.1 adds the model row `Gemini 4 Argon · medium` under the footer; the question
  # itself and the box's rows are unchanged.
  - from: '1.4.1'
    to: '1.4.1'
    label: 'Yes, I trust this folder'
    mark: '>'
    footer: 'enter Confirm'
    action: '0d'
    capture: antigravity/1.4.1/trust.txt
    extract:
      after: 'Accessing workspace:'
      before: 'Do you trust the contents of this project?'
  # The same dialog again on 1.4.2 (`antigravity/1.4.2/trust.txt`): the marked row, the footer
  # and the path's place between `Accessing workspace:` and the question are unchanged. The model
  # row 1.4.1 drew under the footer is gone again, as it was on 1.4.0.
  - from: '1.4.2'
    to: '1.4.2'
    label: 'Yes, I trust this folder'
    mark: '>'
    footer: 'enter Confirm'
    action: '0d'
    capture: antigravity/1.4.2/trust.txt
    extract:
      after: 'Accessing workspace:'
      before: 'Do you trust the contents of this project?'
startup_reads:
  - AGENTS.md
  - GEMINI.md
models:
  option:
    - --model
  ids:
    - match: '^gemini-([0-9]+(?:\.[0-9]+)?)-(flash|pro|argon)(?:-(high|medium|low))?$'
      ignore_case: true
      model: 'Gemini {2:title}'
      version: '{1}'
status_model:
  - match: '(?:^|[\s·|])Gemini\s+([0-9]+(?:\.[0-9]+)*)\s+(Flash|Pro|Argon)\b'
    ignore_case: true
    model: 'Gemini {2:title}'
    version: '{1}'
    # The families the capture knows, whatever case the row spells them in; `{2:title}`
    # reads each back in title case. Argon is the 1.3.5 idle footer `Gemini 4 Argon · medium`.
    yields: [Gemini Flash, Gemini Pro, Gemini Argon]
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
screen:
  chrome:
    - '^\s*↑/↓ Navigate.*$'
    - '^esc to cancel\s+Gemini\s+[0-9].*$'
  trust:
    ignore_case: true
    rules:
      - all:
          - 'Do you trust the contents of this project\?'
          - '>\s*Yes, I trust this folder'
        below_last_rule: 'enter Confirm'
      # The captured trust dialog fills the pane: there is no composer rule.
      - all:
          - 'Do you trust the contents of this project\?'
          - '>\s*Yes, I trust this folder'
          - 'enter Confirm'
        without_rule: true
  permission:
    ignore_case: true
    rules:
      - all:
          - 'Requesting permission for:'
          - '^\s*>\s*[0-9]\.\s+Yes\b'
        below_last_rule: '↑/↓ Navigate'
      # A long command pushes the one rule out of the window. The dialog is the
      # three lines, with no composer rule left to sit below.
      - all:
          - 'Requesting permission for:'
          - '^\s*>\s*[0-9]\.\s+Yes\b'
          - '↑/↓ Navigate'
        without_rule: true
      # The file-creation prompt, as permission-write-54.txt draws it: the question line and
      # its two numbered options below the dialog's own rule, the navigation footer under
      # them all. The same words in a transcript sit above the box's closing rule, so the
      # footer below the last rule is the dialog's, never a quote's.
      - all:
          - 'Allow creation of this file\?'
          - '^\s*>\s*1\.\s+Yes, allow creation\b'
          - '^\s*2\.\s+No, deny creation\b'
        below_last_rule: '↑/↓ Navigate'
      # The file-edit prompt, as permission-edit-54.txt draws it, in the same frame.
      - all:
          - 'Accept this file edit\?'
          - '^\s*>\s*1\.\s+Yes, accept this change\b'
          - '^\s*2\.\s+No, reject this change\b'
        below_last_rule: '↑/↓ Navigate'
  # The Unsent Comments dialog, as question-unsent-54.txt draws it: the CLI asks a person to
  # confirm sending before it acts, and no rule is in the window. A bare input row after the
  # anchor makes the words a transcript above the composer. It confirms a change rather than
  # asking the agent a question.
  confirmation:
    - all:
        - 'You have unsent comments\. Ready to send\?'
        - 'y send and exit · n exit without sending'
      without_rule: true
      none_after:
        anchor: 'You have unsent comments\. Ready to send\?'
        patterns:
          - '^>\s*$'
  question:
    # The question tool's choice screen, as question-54.txt draws it: the Question 1/1 line
    # and its option rows (the first marked, Write-in... the last) below the dialog's own
    # rule, the select footer under them all. A quoted question in a transcript is above
    # the box's closing rule, so the footer below the last rule is the dialog's.
    - all:
        - '\bQuestion [0-9]+/[0-9]+:'
        - '^\s*>\s*1\.\s'
        - '\bWrite-in\.\.\.'
      below_last_rule: '↑/↓ Navigate · enter Select'
  rate_limit:
    # A usage wall reported from the field (2026-10-21): the pane read `Individual quota
    # reached`, with a reset span under it (`Resets in 47h31m`). No capture of the frame
    # exists, so the placement is not invented: `at_composer` reads the block directly above
    # the box as one block, every row of it matching the rule (a printed reset value wrapped
    # onto its own row under the sentence is the one continuation the reader allows). The
    # reported frame is the two
    # rows below (sentence, then reset) over the box's blank margin, and a screen that names
    # no reset is the one-row form; the second rule reads that one without requiring a reset.
    # A sentence quoted inside a turn, with later text between it and the box, is not the
    # wall. A frame that draws the notice elsewhere stays unread — the known limitation until
    # a sanitized capture arrives. The reset is printed as the screen words it; a screen
    # naming none is an explicit unknown, never an invented time.
    - all:
        - '\bIndividual quota reached\b'
        - '\bResets in\s+[^│|]+'
      live: true
      at_composer: true
    - all:
        - '\bIndividual quota reached\b'
      live: true
      at_composer: true
  working:
    - any:
        # Generation indicator
        - '\bGenerating\.\.\.'
        # Whole braille block with optional leading spaces (thinking preview & tool spinners)
        - '^\s*[⠀-⣿]'
        # Command execution (supports leading spinner or bare prompt)
        - '\bRunning command\.\.\.'
        # Active tool execution
        - '^\s*●\s+Running\b'
  # Where each dialog's question sits, so a report can quote it. The question tool words its
  # question after the counter's colon (`antigravity/1.2.16/question-54.txt`); the unsent
  # confirmation asks on its own sentence row (`antigravity/1.2.16/question-unsent-54.txt`).
  # The question is drawn inline after the tool's `Question N/N:` counter, and its block ends at
  # the first option row (`> 1. alpha`, `  3. Write-in...`, 1.4.2/question.txt). A question wraps
  # with the pane's width, so the walk reads up to the marker rather than one row; six rows is the
  # cap this profile declares, and a block still going past it is reported cut, never answered
  # part-way.
  question_text:
    question:
      inline: '^\s*Question [0-9]+/[0-9]+:'
      until: '^\s*>?\s*[0-9]+\.\s'
      rows: 6
      strip:
        - '^\s*Question [0-9]+/[0-9]+:\s*'
    confirmation:
      inline: 'You have unsent comments\. Ready to send\?'
  composer:
    mode: two-rules-footer-below
    ignore_case: true
    # The input row is the box's first row under its opening rule, carrying the prompt at the
    # pane's first column — unsent.txt draws `> Rules...` there, content at the second — and a
    # prompt glyph on a continuation row is content, never the input row. The reader anchors
    # this pattern to the captured column.
    prompt: '^>\s*'
    # Both rules are unbroken runs of ─ from the pane's first column (unsent.txt draws them at
    # rows 7 and 12). A rule-looking row the box holds is drawn at the content column and is
    # content, never the frame.
    rule: '^[─━]{8,}\s*$'
    # A long paste folds: the row reads `↑ N more lines` (with the prompt glyph on the
    # input row's own marker), the rows below it are the tail. Capture 1 is N.
    fold: '^\s*(?:>\s*)?↑\s*([0-9]+)\s+more lines\s*$'
    footers:
      - '\? for shortcuts'
      - 'Gemini\s+[0-9]'
      - 'esc to cancel'
      - '>\s*/exit\s+Exit'
    placeholders:
      - equals: ''
