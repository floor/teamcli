# Muse Code's screen, captured from muse 1.4.9, 1.4.11 and 1.4.14 (herdr 0.7.1). The composer is
# a box between two rules: an opening rule that carries a label (`── Voice input (⌥ + v to start)
# ───…`), the input row `❯ text` under it, an unlabelled closing rule of the same width, and one
# footer row below (`  muse-wonder-1.0 · high · …/muse-ws · Auto-review` in 1.4.9;
# `  muse-wonder-full-1.0 · high · …/project · YOLO` in 1.4.11). `muse` draws on the alternate
# screen, so the captures are `pane read --source visible`. 1.4.14 draws the same box and, as the
# text is typed, a completion row of its own inside it (`  /exit  Quit when idle`): the composer
# declares that row, and `exit_completion` below carries the measured exit behaviour.
format: 1
cli: muse
binary: muse
# `~/.local/bin/muse` is a shell wrapper that execs `muse-bin-<version>-<build>`. herdr's
# `pane process-info` reported `argv0: muse-bin-1.4.9-R6297.1` and the name `muse-bin-1.4.9-`:
# macOS cuts a process name to 15 bytes, so the version is part of the cut name. A trailing `*`
# is a prefix: it covers the next release without a profile edit.
process_names:
  - muse
  - muse-bin-*
# From a run: `muse --version` printed `Muse Code 1.4.9 (1.4.9-R6297.1)`; the 1.4.14 window's
# banner reads `Muse Code 1.4.14`.
tested:
  from: '1.4.9'
  to: '1.4.14'
# From a run: `muse --help` lists `--yolo` as disabling approval and the macOS sandbox and trusting
# the workspace. Without it the sandbox treats `.agents/` as protected metadata, and a write to
# `.agents/team.log` stops at an approval prompt (permission.txt, `touch .agents/test.txt`).
unattended:
  - --yolo
# No flag appends to the system prompt, so the rules are the first message.
rules:
  launch_prompt: positional
# The delivery class a run measured: no MCP inbox is registered for this CLI and it has no event
# adapter, so no event leg wakes an idle seat; a message waits in its bus inbox, and the typed
# wake below is the one fallback that can reach the box itself.
delivery: none
# The typed-wake exception to the no-pane-messaging rule (2026-10-31), granted per profile and
# narrowly: a send may type one trigger line into a composer two reads showed as the empty
# idle prompt, presses Enter (this CLI's submit; Return is not) only while the box still
# holds exactly that line, and calls itself delivered only when the `working` screen above
# appears. Nothing else is typed, no draft is moved or cleared, and a wake that cannot
# deliver leaves the message in the bus inbox. The screen rules below are what the wake
# reads back: `idle` is the empty box, `working` is the acknowledgement. See
# src/send/typed-wake.ts.
typed_wake: screen
# herdr 0.7.1 reports a muse pane as no agent, or `unknown`, while the CLI runs: `agent list`
# carried the 1.4.11 pane with no `agent` type and `agent_status: "unknown"` while Muse sat at
# its ready box. The profile's own screen reading is the seat's state there: a recognised idle
# box counts as free, the rules delivery types on that reading, and a recognised working screen
# is the acknowledgement of a submission herdr cannot report.
herdr_status: unreliable
login:
  # Muse Code 1.4.9 has no non-interactive login check: `muse auth` only stores an API key
  # (`muse auth set --api-key-stdin`), and `muse auth status` prints "expected `auth set`".
  # The account shows in the interactive /status only.
  hint: muse login
exit: /exit
# Measured on 1.4.14 (2026-11-02, echo provider, a scratch pane): typing `/exit` makes Muse draw
# its completion row inside the box, and an Enter pressed before the row settles is drawn as a
# typed newline instead of running the command. The row appears about 21 ms after the text is
# typed; with Enter sent that long after the row appeared, 0 ms and 50 ms typed the newline (2/2
# each), and 100, 150 and 250 ms ran `/exit` (2/2 each). A second Enter on the newline frame runs
# it (10/10). ctrl+u on the completion frame cleared the text back to the idle box, and it does
# nothing on the newline frame. Frames and measurements: test/fixtures/exit-typing/, muse-*.
exit_completion: true
# An operator probe of this CLI names ctrl+u as the key that empties the composer; the 1.4.14
# scratch probe above clears the exit text and its completion row with it.
exit_clear: ctrl+u
timeouts:
  idle: 90s
  exit: 30s
# From a run: `--model <MODEL>` is the model flag (no short form). `model/list` answered four
# user-facing ids: muse-wonder-1.0, muse-wonder-full-1.0, muse-spark-1.3 and muse-spark-1.2. A
# contributor account routes them on the wire to `<id>-contributor`, which a launch line may
# also name; the footer always shows the base id.
models:
  option:
    - --model
  ids:
    - match: '^muse-wonder-full-([0-9]+(?:\.[0-9]+)*)(?:-contributor)?$'
      ignore_case: true
      model: 'Muse Wonder Full'
      version: '{1}'
    - match: '^muse-wonder-([0-9]+(?:\.[0-9]+)*)(?:-contributor)?$'
      ignore_case: true
      model: 'Muse Wonder'
      version: '{1}'
    - match: '^muse-spark-([0-9]+(?:\.[0-9]+)*)(?:-contributor)?$'
      ignore_case: true
      model: 'Muse Spark'
      version: '{1}'
# The running model is the footer row under the closing rule. Wonder Full is first, so
# `muse-wonder-full-1.0` is not read as Wonder.
status_model:
  - match: '^\s+muse-wonder-full-([0-9]+(?:\.[0-9]+)*)\s+·'
    model: 'Muse Wonder Full'
    version: '{1}'
    yields: ['Muse Wonder Full']
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
  - match: '^\s+muse-wonder-([0-9]+(?:\.[0-9]+)*)\s+·'
    model: 'Muse Wonder'
    version: '{1}'
    yields: ['Muse Wonder']
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
  - match: '^\s+muse-spark-([0-9]+(?:\.[0-9]+)*)\s+·'
    model: 'Muse Spark'
    version: '{1}'
    yields: ['Muse Spark']
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
# The `/usage` box prints the two windows of the Power plan: `Current` is the 5-hour rolling
# window and `Weekly` is the week (usage.txt). The watch reads figures from the composer's footer
# row alone, and muse's footer carries neither, so these patterns produce a figure only on a
# screen whose footer row says it; the `/usage` box is not read.
quota:
  - account: meta
    match: 'Current\s+([0-9]+)% used'
    used: '{1}%'
    window: session
  - account: meta
    match: 'Weekly\s+([0-9]+)% used'
    used: '{1}%'
    window: weekly
screen:
  # The startup dialog without `--yolo` or `--trust-workspace`.
  trust:
    - all:
        - 'Do you trust this workspace\?'
        - '⟩\s+1\s+Trust and continue'
        - '2\s+Quit'
  # A tool call that needs approval, drawn in the composer's place.
  permission:
    - all:
        - 'Would you like to run the following command\?'
        - '⟩\s+1\.\s+Yes, proceed'
        - 'No, and tell Muse Code what to do differently'
  # The `/model` picker replaces the input row.
  question:
    - all:
        - 'Choose model'
        - '↑↓ move · enter confirm · esc go back'
  working:
    - any:
        - '^\s*[◇◈]\s+.*esc to interrupt'
  composer:
    mode: box-to-rule
    # The prompt glyph sits at the pane's first column on the input row.
    prompt: '^❯'
    # Both rules start with two `─`; the opening one carries a label between them and the run.
    # The two are one box when they are drawn at one width.
    rule: '^[─━]{2}(?: [^─━]+ )?[─━]{8,}$'
    footers:
      - '^\s{2}\S.*\s·\s.*$'
    # Rotating hints are faint, or drawn in the grey declared below with no faint attribute at
    # all. A row after the prompt that is all faint, or one non-bold declared colour, is the
    # empty box; a row in any other colour is text, including a draft that starts with `/`.
    # The equals lines are the plain-read fallback. The rotation is not added to them.
    placeholder_style: dim
    # 1.4.14 draws its rotating hint in this grey with no faint attribute at all (a live 1.4.14
    # pane, 2026-11-05): the blue prompt, then the hint text in 38;2;103;108;116. An input row
    # whose text past the prompt is that one colour is the empty box. Typed text on 1.4.14 is
    # drawn blue (38;2;90;160;255), so a draft stays text; an undeclared grey keeps the row
    # text too.
    placeholder_fg:
      - '38;2;103;108;116'
    placeholders:
      - equals: ''
      # An operator's notes transcribe the fresh composer as showing this hint; the
      # saved idle capture shows the input row empty.
      - equals: 'Type @ to search and insert workspace file paths'
      # The pane's rotating prompt hint, drawn greyed in the input row between the Voice input
      # rules; confirmed on a running 1.4.11 pane, which drew it as the box's whole input.
      - equals: 'Tab queues or steers while a run is active'
      # A plain read of the /goal hint. These equals lines stay exact.
      - equals: '/goal pins a session objective with a progress bar'
      # A plain read of the two tasks hints. The same words with more text stay text. An
      # exact equals line drawn in a non-bold colour is the placeholder; a bold one stays text.
      - equals: '/tasks shows your open tasks'
      - equals: '/tasks shows workflows, subagents and terminals in one place'
      - shape: slash-hint
    # 1.4.14 draws a completion row of its own under the input row, inside the box, for the text
    # being typed — `  /exit  Quit when idle` for `/exit` (muse-unsent-ansi.txt). The row is the
    # pane's, not text: it is left out of the box's rows, so the box reads back as the typed text
    # alone.
    own_rows:
      - '^ {2}/exit {2}Quit when idle$'
    # A 1.4.11 pane draws a typed newline as an empty row under the line, inside the box, before
    # the closing rule (captured: the rules line with an Enter pressed on it). It is a row of the
    # text, not the box's frame: the pre-Enter frame draws the line alone, so it is not stripped,
    # and a trailing empty row never reads back as the line. 1.4.14 draws the same newline frame
    # in place of its completion row (muse-unsent-newline-ansi.txt); `exit_completion` above
    # covers it with one retried Enter.
