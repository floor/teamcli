# Claude Code's screen. The trust question carries ignore_case on its own pattern:
# the old classifier ignored case on those lines and not on the "1. Yes" choice,
# and a rule-wide or stage-wide flag would have reached the choice too.
format: 1
cli: claude-code
binary: claude
process_names:
  - claude
tested:
  from: '2.1.288'
  to: '2.1.302'
unattended:
  - --dangerously-skip-permissions
rules:
  option: --append-system-prompt
login:
  check:
    - auth
    - status
  hint: claude auth login
exit: /exit
# The one key that empties the box, from the 2.1.291 capture: ctrl+c returns the
# pane byte-for-byte to its idle screen. Used only to clear an exit text that did not
# read back as typed, and only when the box holds exactly that text.
exit_clear: ctrl+c
# The measured way into the input box (2026-10-19, herdr 0.7.1, a 54-column pane, 2.1.303): at
# idle one ctrl+c emptied a five-line draft and the screen returned to its idle prompt, the CLI
# staying open; a ctrl+c on an already-empty idle box left it idle too. During a running turn
# ctrl+c interrupts the turn, so the turn's own clear is ctrl+u, which removed about one row per
# press and left the turn running. A draft pasted back with bracketed paste while the turn ran
# stayed in the box with its rows unchanged, and Enter mid-turn queued the typed line.
input:
  clear:
    - ctrl+c
  clear_working:
    - ctrl+u
  paste: bracketed
  mid_turn: true
# The one key that confirms the CLI's own exit question, from the same 2.1.291 captures
# (test/fixtures/exit-typing/): a seat with background work — a shell, a scheduled task —
# answers the one Enter on `/exit` with "Background work is running" and the preselected
# "❯ 1. Exit and stop tasks", and stays; one more Enter exits it. Declared with the
# `exit_question` stage below: a stop answers that screen only when the profile names both.
exit_confirm: enter
# The files a run of 2.1.291 showed this CLI writing in its working folder: the folder
# stayed empty through the start, the trust dialog, an answered prompt and five idle
# minutes; one scheduler call (CronCreate) made the folder ".claude" and, inside it, the
# regular file below — the scheduler's one lock — and at /exit the CLI deleted the lock
# and left the empty folder. The lock is written by that call and deleted at exit.
# A later run of each shipped CLI in a fresh working folder showed that claude-code,
# codex, cursor, antigravity and grok read instruction or settings files there at start.
# Those paths are `startup_reads` on each profile. This list is only what the CLI writes.
lobby_files:
  - .claude/scheduled_tasks.lock
startup_reads:
  - CLAUDE.md
  - CLAUDE.local.md
  - .claude/CLAUDE.md
  - .claude/rules/
  - .claude/settings.json
timeouts:
  idle: 90s
  exit: 30s
models:
  option:
    - --model
  ids:
    - match: '^claude-(opus|sonnet|haiku|fable)-([0-9]+)-([0-9]{1,2})(?:-[0-9]{8})?$'
      model: 'Claude {1:title}'
      version: '{2}.{3}'
    - match: '^claude-(opus|sonnet|haiku|fable)-([0-9]+)(?:-[0-9]{8})?$'
      model: 'Claude {1:title}'
      version: '{2}'
# Opt-in status-line format, exercised by a constructed screen fixture in quota.test.ts.
# L and W are subscription percentages USED; they are never context-window percentages.
quota:
  - account: anthropic
    match: '\bL: ([0-9]+)% \(([0-9hm]+)\)'
    used: '{1}%'
    resets: '{2}'
    window: session
  - account: anthropic
    match: '\bW: ([0-9]+)% \(([0-9hm]+)\)'
    used: '{1}%'
    resets: '{2}'
    window: weekly
  # The same labels with the pace margin the configurable status line prints before the reset:
  # `W: 12% (+13.3%) (125h26m)` — the row a real screen in the suite carries (status.test.ts).
  # The margin is the line's own `expected minus used` figure; the report reads it from the row
  # itself, so these patterns carry the percentage and the reset and drop only the margin.
  - account: anthropic
    match: '\bL: ([0-9]+)% \((?:[+\-±][0-9.]+%)\) \(([0-9hm]+)\)'
    used: '{1}%'
    resets: '{2}'
    window: session
  - account: anthropic
    match: '\bW: ([0-9]+)% \((?:[+\-±][0-9.]+%)\) \(([0-9hm]+)\)'
    used: '{1}%'
    resets: '{2}'
    window: weekly
status_model:
  - match: '(?:^|[\s·|])(Opus|Sonnet|Haiku|Fable)\s+([0-9]+(?:\.[0-9]+)*)(?:$|[\s·|])'
    model: 'Claude {1}'
    version: '{2}'
    # The families the capture knows, as `Claude {1}` spells them; the versions `{2}` can carry.
    yields: [Claude Opus, Claude Sonnet, Claude Haiku, Claude Fable]
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
screen:
  # The completion row a finished turn draws before the next prompt (working.txt's
  # `✻ Cogitated for 3s · done 11:36 PM · 1 shell still` and unsent-multiline's
  # `✻ Sautéed for 2s · done 5:25 PM`): the glyph at the pane's first column, the duration,
  # the clock time, and the shell count a turn with a live shell appends. A `live` rule's
  # newest turn starts after the last of these above the box, so a sentence an ended turn
  # already carries is history. Quoted or indented lookalikes are transcript text, never a
  # turn end.
  turn_end: '^✻ .+ · done [0-9]{1,2}:[0-9]{2} [AP]M(?: · .+)?$'
  # The shell after `/exit` on 2.1.299 and 2.1.302: `Resume this session with:` and `claude --resume`.
  unknown:
    - any: ['Resume this session with:']
  trust:
    - all:
        - match: '(?:Do you trust (?:this|the) folder\?|One you trust\?)'
          ignore_case: true
        - '^\s*[❯›>]?\s*1\.\s+Yes\b'
    - all:
        - '^\s*[❯›>]?\s*Yes, I trust this folder\b'
      footer: 'Enter to confirm · Esc to cancel'
    # 2.1.299 and 2.1.302 (`claude-code/2.1.302/trust.txt`): a "Quick safety check" whose marked
    # row is `No, exit` and whose second row is `Yes, I trust this folder`. Enter
    # confirms the marked row. The footer is the one the earlier dialog already uses.
    - all:
        - 'Quick safety check:'
        - '^\s*❯\s*No, exit\s*$'
        - '^\s*Yes, I trust this folder\s*$'
        - 'Enter to confirm · Esc to cancel'
  # A quoted question above the composer's rule is not a dialog. The footer is the
  # captured last line and needs the question. A Yes/No choice below the last rule
  # is the other shape; the mark is optional, as on an unmarked "2. No".
  permission:
    - all:
        - 'Do you want to (proceed|make this edit|create|allow)'
      footer: 'Esc to cancel · Tab to amend'
      below_last_rule: 'Esc to cancel · Tab to amend'
    - below_last_rule: '^\s*❯?\s*[0-9]\. (Yes|No)\b'
    # A pane with no composer rule whose choice is the dialog, including the
    # unmarked "1. Yes" while up is running. A choice quoted above an empty
    # prompt is a transcript: the empty prompt comes after it.
    - all:
        - '^\s*❯?\s*[0-9]\. (Yes|No)\b'
      without_rule: true
      none_after:
        anchor: '^\s*❯?\s*[0-9]\. (Yes|No)\b'
        patterns:
          - '^\s*[❯›>]\s*$'
  # The CLI's own question after the exit text, from the 2.1.291/2.1.292 captures: it names the
  # background work that will stop and preselects "Exit and stop tasks", whose confirming key
  # is `exit_confirm` above. Its footer is an ordinary question's own, so this stage must read
  # before `question` — the core's order runs it first, and a profile cannot move it. Nothing
  # but a stop reads this screen to press a key; every other reader only reports it.
  #
  # The dialog is read as one block of rows, and the block is the screen's own bottom: it starts
  # at the last "Background work is running" the window draws — a transcript above it may quote
  # the same row — and only blanks may follow the footer. Every row the block draws is compared
  # whole, after the frame's own indentation, against the captured text, and the blanks are the
  # spacing the captures show. A row a form does not carry is never that row: "3. Stay — but
  # leave tasks running", "2. Stay and delete work" and a footer with anything appended are rows
  # no run has drawn, and the screen reads as the ordinary question it looks like. Nor is a row
  # changed, dropped, doubled or moved the row the block draws: another second row, "2. Move to
  # background and exit" above the marked row with only "3. Stay" below it, the move row without
  # its "3. Stay", the marker off the first choice, two adjacent rows swapped, a row of another
  # dialog under the footer — each fails a step, and a stop fails closed then: it stays the
  # ordinary question the window looks like (test/fixtures/exit-typing/ names every such screen
  # and its README says how each was built).
  #
  # The CLI draws two tails and a form draws no other. Holding the selection where it started,
  # each draws the title row, the "will stop" row, the rows the CLI fills with its own text and
  # the marked "Exit and stop tasks" row, then:
  #
  #     ❯ 1. Exit and stop tasks          ❯ 1. Exit and stop tasks
  #       2. Stay                           2. Move to background and exit
  #                                          3. Stay
  #     Enter to confirm · Esc to cancel  Enter to confirm · Esc to cancel
  #
  # and, in the pane the CLI draws its own row budget into, the marked row and the footer alone:
  #
  #     ❯ 1. Exit and stop tasks
  #
  #     Enter to confirm · Esc to cancel
  #
  # The middle form is what a session the CLI can move into the background draws
  # (test/fixtures/exit-typing/, `claude-code-shell-move-question.txt` from the release run's
  # capture, and `claude-code-shell-scheduled-move-question-ansi.txt` from this profile's own
  # scratch capture of a seat holding a shell and a scheduled task at once). Its value "Move to
  # background and exit" is never confirmed here: `exit_confirm` is the confirming key of the
  # marked row above it, and a stop means stop. The last is the clipped render — a pane too
  # short for the choice list, drawn as one task row, its own `… +1 item` row, the marked choice
  # and the footer, no other choice at all
  # (`claude-code-shell-scheduled-move-question-clipped-ansi.txt`).
  #
  # The rows the CLI fills with its own text are the one part the block cannot name. What they
  # may be is bounded by what the captures draw — the item list of the work that will stop: a
  # shell's `shell · sleep 600`; a scheduled task's label and text over two rows, the
  # description wrapped under its column; the `… +1 item` row of a clipped list. So a row of
  # that run is a row that is not blank, is not any row the block draws in any of the three
  # forms, is not a numbered menu row (`2. Stay` and its like are the block's to name, never the
  # list's), and is not a row already read — nothing is drawn twice. The run is read one row at
  # a time, so a row the block draws below it ends it rather than being swallowed by it.
  exit_question:
    - block:
        - 'Background work is running'
        - 'The following will stop when you exit:'
        - ''
        - list: true
        - ''
        - '❯ 1. Exit and stop tasks'
        - one_of:
            - ['2. Stay']
            - ['2. Move to background and exit', '3. Stay']
            - []
        - ''
        - 'Enter to confirm · Esc to cancel'
  question:
    # The phrase is the dialog's last line, as a permission footer is. Prose
    # above the box is not a question.
    - any:
        - 'Enter to select'
        - '↑/↓ to navigate'
        - 'Enter to confirm'
        - 'Esc to cancel'
      on_footer: true
    - below_last_rule: 'Enter to select|↑/↓ to navigate|Enter to confirm|Esc to cancel'
    # The footer has a status line under it and the rule is out of the window.
    # A phrase quoted above an empty prompt is a transcript.
    - any:
        - 'Enter to select'
        - '↑/↓ to navigate'
        - 'Enter to confirm'
        - 'Esc to cancel'
      without_rule: true
      none_after:
        anchor: 'Enter to select|↑/↓ to navigate|Enter to confirm|Esc to cancel'
        patterns:
          - '^\s*[❯›>]\s*$'
  # The prompt is back and the error is still on the pane. Herdr calls the seat done. The
  # sentence is the one a seat printed; no capture shows a retry key, so none is named. `live`
  # reads it on the live region alone: the newest turn above the box, never a turn the pane has
  # scrolled past, so an old error over an idle prompt stays an idle prompt. The newest turn
  # starts after the last completion row (see `turn_end`), so an error the turn already ended —
  # Atlas's observed seat, idle and ready — is history, while an error after a completion is
  # still the live screen.
  provider_error:
    - any:
        - 'API Error: Connection lost mid-response\. The response above may be incomplete\.'
      live: true
  # The rejected line, matched on the fragments that were quoted: the field report names
  # 429 and 403 as this CLI's usage-limit rejections. Whatever follows "Your limit will
  # reset at" is the reset time the watch reports.
  rate_limit:
    - all:
        - 'API Error: Request rejected \((?:429|403)\)'
        - 'Usage limit reached'
        - 'Your limit will reset at'
  working:
    - any:
        - '\besc to interrupt\b'
        - '^[^\S\n]*[✢✳✶✻✼✽][^\n]*…\s*\(\s*\d'
  composer:
    mode: box-to-rule
    # The prompt sits at the pane's first column, as unsent-typed-ansi.txt draws `❯ Fix the`;
    # the pane draws continuation rows at the content column — two spaces — so a prompt glyph
    # on one of those is content, never the input row. The reader takes the box's first row
    # under its opening rule and anchors this pattern to the captured column: a row the box
    # holds can never be mistaken for the input.
    prompt: '^[❯›>]'
    # The box's two rules, as unsent-typed-ansi.txt draws them: one unbroken run of ─ from the
    # pane's first column, the closing rule the window's last rule row. The opening rule may
    # carry a right-aligned label in its run, as Atlas's retained RC2 capture of builder-7 (an
    # installed 0.5.4-rc.2 on source 4e50561d; CLI version unknown) draws
    # `──── … ──── builder-7 ─` over an empty box, so the run may hold one label; the two rules
    # still compare at one width. The label and the run after it are one optional group: a flat
    # eight-column rule stays a rule (the run needs its eight columns with or without a label).
    # A rule-looking row the box holds is drawn at the content column and is content, never the
    # frame.
    rule: '^[─━]{8,}(?: [^─━]+ [─━]+)?$'
    # Explicit subscription labels from the configurable quota status line; context percentages
    # and transcript text are not quota. The constructed fixture documents this format.
    status: '\b[LW]: [0-9]+% \((?:[0-9hm]+|[+\-±][0-9.]+%\))'
    footers:
      - '^\s{2,}.*·.*(?:Opus|Sonnet|Haiku|Fable)\s+[0-9]+.*$'
      - '^\s{2,}(?:(?:⏵⏵\s+)?bypass permissions|⏸\s+manual mode)\b.*$'
    # Claude Code greys every suggestion it shows — "Try …", "Resume briefly.", any other —
    # with faint styling, while typed text carries none. The list below stays the fallback
    # for a source without styling.
    placeholder_style: dim
    placeholders:
      - equals: ''
      - prefix: 'Try "'
