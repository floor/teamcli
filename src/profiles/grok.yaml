# Grok's screen. The composer is a bordered box: an opening rule drawn `  ╭────…────╮`, the input
# row `  │ ❯ text` under it, and a closing rule `  ╰────…────╯` that carries the footer title.
# The closing rule's dash run moves with the title's length (11 leading dashes under
# `Grok 4.7 (xhigh)`, 6 under `Grok 4.7 Fast (xhigh)`, and the 1.0.52 captures
# `Grok 4.7 (high)` and `Grok 4.7 (high) · always-approve`), so the rule pattern is the
# two dashes every rule of the box carries: the runs the read compares are then equal at any
# width or title. `Resume this session with:` is the shell screen the CLI leaves behind on exit.
format: 1
cli: grok
binary: grok
process_names:
  - grok
# From a run: `grok --version` printed `grok 1.0.52 (0920c8169e27) [stable]`, exit 0.
# The 1.0.50 captures still match; the ceiling is the 1.0.52 capture.
tested:
  from: '1.0.50'
  to: '1.0.52'
# From a run: `grok --help` lists `--always-approve` as "Auto-approve all tool executions". The
# same text launched the pane every capture under test/fixtures/grok/1.0.50 was taken from.
unattended:
  - --always-approve
# The rules ride the launch line: `grok --help` lists `--rules <RULES>` as "Extra rules to
# append to the system prompt", and `grok --rules 'Reply only RULES_RECEIVED.' --version`
# exited 0 — the same command with `AGENT_UNATTENDED=1` set exited 0 too. So no box read-back
# stands between a seat and its rules.
rules:
  option: --rules
login:
  check:
    - models
  # From a run: `grok models` printed "You are logged in with grok.com." and the available
  # model ids, exit 0; `grok --help` lists the `login` subcommand as "Sign in to Grok".
  hint: grok login
exit: /exit
# A 1.0.50 probe: with `LEFTOVER_TEXT` standing in the box, the ctrl+u key left the box empty
# again. Used only for an exit text that did not read back as typed — the leftover an earlier
# stop can leave — cleared before the text is typed fresh.
exit_clear: ctrl+u
# No `exit_confirm`: no run met an exit question. From the captures, `/exit` followed by one
# Enter left the CLI for its shell with nothing asked; exit.txt is the shell after it.
timeouts:
  idle: 90s
  exit: 30s
# From a run: `grok models` (1.0.50) printed "Default model: grok-4.7-build-fast" and the
# available ids `grok-4.7`, `grok-4.7-build-fast`, `grok-4.6`, `grok-4.5`; `grok --help` lists
# `-m, --model <MODEL>` as "Model ID to use". The same help (1.0.60) lists no status-line flag.
# `grok models` names the account default, which follows the last launch, not one pane.
# The running model is the box's closing rule. A scratch pane at `stty size` `23 53`:
# `grok --always-approve --model grok-4.7` drew
# `╰──────────── Grok 4.7 (high) · always-approve ─╯` under `Grok Build  1.0.52 [stable]`,
# and the same flags once the CLI reported 1.0.60 drew that rule under
# `Grok Build  1.0.60 [stable]`. `--model grok-4.7-build-fast` drew
# `╰─────── Grok 4.7 Fast (high) · always-approve ─╯` under `Grok Build  1.0.60 [stable]`.
# A private home whose config set `[ui.status_line]` `items = ["model"]` first drew a browser
# sign-in with no model, then the same closing rule and no separate status row. The owner's
# config was not edited. The tested range stays 1.0.50–1.0.52: those 1.0.60 runs showed the
# footer and are not a full capture set. A question widget replaces the box, so it stays unread.
startup_reads:
  - AGENTS.md
  - CLAUDE.md
  - CLAUDE.local.md
  - .claude/CLAUDE.md
  - .claude/rules/
# The team inbox registers through Grok's own project-scope add. Measured in a scratch
# folder on 1.0.60: `grok mcp add -s project team-inbox <command> -- <entry> mcp serve
# --seat helper --session acme` exited 0, printed
# `Added stdio MCP server 'team-inbox' ... to project config` and `File modified:
# <folder>/.grok/config.toml`, and wrote that file with `[mcp_servers.team-inbox]`, the
# command, the args array exactly as given, and `enabled = true`. `grok mcp list` in the
# same folder printed the server with that command and args, marked `(project)`. The
# command is this install's runner, so the server starts whether or not `team` is on the
# PATH, and the launch refuses to write the file where the project does not ignore it.
mcp_inbox:
  add:
    - mcp
    - add
    - -s
    - project
    - team-inbox
    - '{command}'
    - '--'
    - '{entry}'
    - mcp
    - serve
    - --seat
    - '{seat}'
    - '{epoch}'
    - --session
    - '{session}'
    - '{file}'
  target: .grok/config.toml
models:
  option:
    - --model
  ids:
    - match: '^grok-([0-9]+(?:\.[0-9]+)*)-build-fast$'
      ignore_case: true
      model: 'Grok {1} Fast'
      version: '{1}'
    - match: '^grok-([0-9]+(?:\.[0-9]+)*)$'
      ignore_case: true
      model: 'Grok {1}'
      version: '{1}'
# From a run (1.0.60, a chat session on a scratch pane): the row grok paints under the composer's
# closing rule, at the pane's right edge, read `Weekly limit left: 0% · ` — the weekly quota
# figure, repainted on every refresh. The welcome screen draws no such row; the row is the
# session footer's. The quota read below takes this row, and only under the closing rule.
quota:
  - account: xai
    match: '\bWeekly limit left: ([0-9]+)%'
    left: '{1}%'
    window: weekly
# The last six plain lines. Fast is first, so `Grok 4.7 Fast (` is not read as `Grok`. The
# effort paren is required, so `Grok Build` and `Grok 4.7 is here!` do not match. The paren
# and `· always-approve` stay outside the model. The file's model is the name without the
# version: a non-fast footer reads `Grok`, a fast footer reads `Grok Fast`, and the version
# is the number in the footer. A `Grok` seat whose footer says Fast therefore differs.
status_model:
  - match: 'Grok\s+([0-9]+(?:\.[0-9]+)*)\s+Fast\s+\('
    model: 'Grok Fast'
    version: '{1}'
    yields: ['Grok Fast']
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
  - match: 'Grok\s+([0-9]+(?:\.[0-9]+)*)\s+\('
    model: Grok
    version: '{1}'
    yields: [Grok]
    version_like: '^[0-9]+(?:\.[0-9]+)*$'
# A question widget replaces the box, and no rule reads a model off it. The model column then
# falls back to the launch line's model, labelled, never the bare unread marker.
unread_model: launch
screen:
  unknown:
    - any: ['Resume this session with:']
  # The answer widget, from the 1.0.52 capture. A choice and a write approval draw the same
  # chrome: `Waiting on answers`, the ┃ frame, `↑/↓ navigate`, `Enter:submit`, and
  # `Tab:next answer`. A fresh directory drew no trust dialog, and a shell command in the
  # default permission mode ran without a separate allow/deny screen, so this widget is the
  # dialog the capture has. The chrome leaves the pane when the turn ends, so a transcript
  # of the question is not the dialog.
  question:
    - all:
        - 'Waiting on answers'
        - '↑/↓ navigate'
        - 'Enter:submit'
        - 'Tab:next answer'
  working:
    # A running turn, from the captures: the braille spinner row over the box — the verb varies
    # with the moment (`⠴ Waiting for response…       2.0s ⇣1.32k [stop]` at the start,
    # `⠋ Sleep 20 seconds then …   10s ⇣21.0k [↓][stop]` mid-tool) and `[stop]` stands at its
    # end — or the turn footer, whose middle cell is `Ctrl+c:cancel` for exactly as long as the
    # turn runs (`Ctrl+.:shortcuts` once it has ended). The braille range is written as
    # characters: escape sequences are refused by the dialect.
    - any:
        - '^\s*[⠀-⣿].*\[stop\]'
        - '^\s*Shift\+Tab:mode.*Ctrl\+c:cancel'
  composer:
    mode: box-to-rule
    # The input row under the box's opening rule: `  │ ❯ text` at the pane's second column
    # (idle.txt, unsent.txt). Continuation rows are drawn `  │   text` — the left border stays —
    # and never carry the prompt.
    prompt: '^ {2}│ ❯'
    # Every box rule carries `──` in its dash run: the opening rule, the closing rule (whose
    # run moves with the footer title), and nothing else among the captured rows. The nearest
    # rule row above the closing rule is then the box's own opening rule, equal-run at any
    # title length, so the read lands on the box whatever the pane draws above it — the slash
    # menu's own full-width rules sit above the opening rule and stay outside the box the
    # caller compares.
    rule: '─{2}'
    # Every box row is painted out to its closing edge: the input row is `  │ ❯ text` + padding
    # + the right-edge `│`, and the padding and the edge are the frame, not the text. This
    # suffix drops both — the tail the pane paints after the text, down to the end of the row —
    # so a one-row text reads back exactly. A text that wraps does not read back: continuation
    # rows keep the left border, and the comparison takes continuation rows at the text's own
    # column only. The empty box reads `  │ ❯` + padding + the edge, whose trimmed remainder is
    # the edge alone — the placeholder.
    strip_suffix: '\s*│$'
    # The status row under the closing rule, from the same 1.0.60 run as the quota block above:
    # the footer's quota cell `Weekly limit left: 0% · `, painted under the rule in a session.
    # The grammar pins the row by its own words; the read takes the last row under the rule that
    # carries them, so the pane's other footer rows are never mistaken for it.
    status: 'Weekly limit left: [0-9]+%'
    placeholders:
      - equals: '│'
