format: 1
project: pilot
session: pilot
coordinator: lead
operator: lead

workspace:
  mode: shared

trust: [../plain-reviewer]

seats:
  - role: implementer
    name: script-seat           # a script sets the endpoint and the model, then runs claude
    cli: claude-code
    vendor: anthropic
    model: Claude Opus
    version: "5.5"
    launch: zsh launcher.sh

  - role: implementer
    name: plain-codex           # no model flag; the screen is checked instead
    cli: codex
    vendor: openai
    model: GPT Sol
    version: "6"
    launch: codex

  - role: implementer
    name: plain-voyager         # no model flag; the screen is checked instead
    cli: antigravity
    vendor: google
    model: Gemini Flash
    version: "3.8"
    launch: agy

  - role: reviewer
    name: plain-reviewer        # no model flag; the screen is checked instead
    cli: cursor
    cwd: ../plain-reviewer
    vendor: xai
    model: Grok
    version: "4.7"
    launch: cursor-agent

  - role: implementer
    name: lead                  # the launch names the declared model
    cli: claude-code
    vendor: anthropic
    model: Claude Opus
    version: "5.5"
    launch: claude --model claude-opus-5-5

  - role: implementer
    name: other-model           # the launch names another model, and a display spelling
    cli: claude-code
    vendor: anthropic
    model: Claude Opus
    version: "5.5"
    display: Opus 5.5 (dev)
    launch: claude --model claude-fable-5-1

  - role: researcher
    name: parked-one            # stopped: up skips it, doctor leaves its CLI out
    cli: codex
    vendor: openai
    model: GPT Terra
    version: "5.6"
    launch: codex -m gpt-5.6-terra
    stopped: true
