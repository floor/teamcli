    model: Kimi
    version: "K3"
    display: Kimi K3
    launch: claude-kimi

  - role: implementer
    name: grok-implementer
    cli: cursor
    vendor: xai
    model: Grok
    version: "4.7"
    launch: cursor-agent

  - role: implementer
    name: astra-implementer
    cli: codex
    vendor: openai
    model: GPT Astra
    version: "6"
    display: GPT-6 Astra
    launch: codex

  - role: implementer
    name: gemini-implementer
    cli: antigravity
    vendor: google
    model: Gemini Flash
    version: "3.8"
    display: Gemini 3.8 Flash
    launch: agy

  - role: operator
    name: claude-operator
    cli: claude-code
    vendor: anthropic
