# The team that works on this repository, for `team commits check` and `team pr check` in CI.
# A project's own file is private, at .agents/team.yaml; this one is tracked
# because CI needs the signature rules and the seats that may sign.
format: 1
project: team
visibility: public
coordinator: claude-coordinator
operator: claude-coordinator

identity:
  since: 28f2fb56d5b4aaee51cd73e4b0a34b76dd65e803
  forbidden_public:
    - "\\bFLO-[0-9]+\\b"   # internal tracker ids: this repository's issues are #<number>
    - "^[Cc][Oo]-[Aa][Uu][Tt][Hh][Oo][Rr][Ee][Dd]-[Bb][Yy]:"   # no co-authorship trailer: a commit carries its one Agent line only
    - "\\bw[0-9A-Z]+:p[0-9]+\\b"   # pane ids the session prints (w2A:p1): an internal pane is not for a public log
    - "\\bfloor-[0-9a-f]{2}\\b"   # internal session names (floor-3a): the public name is floor/teamcli

trust:
  - ~/.config/team/lobby

workspace:
  mode: shared

seats:
  - role: coordinator
    name: claude-coordinator
    cli: claude-code
    vendor: anthropic
    model: Claude Opus
    version: "5.5"
    launch: claude --model claude-opus-5-5

  - role: implementer
    name: claude-implementer
    cli: claude-code
    vendor: anthropic
    model: Claude Opus
    version: "5.5"
    launch: claude --model claude-opus-5-5

  - role: implementer
    name: claude-implementer-4-8
    cli: claude-code
    vendor: anthropic
    model: Claude Opus
    version: "4.8"
    launch: claude --model claude-opus-4-8

  - role: reviewer
    name: claude-reviewer
    cli: claude-code
    vendor: anthropic
    model: Claude Opus
    version: "5.5"
    launch: claude --model claude-opus-5-5

  # Vendor seats: floor/teamcli is also built by vendor agents, each signing with its display.
  - role: implementer
    name: deepseek-implementer
    cli: claude-code
    vendor: deepseek
    model: DeepSeek Flash
    version: "V4.1"
    display: DeepSeek V4.1 Flash
    launch: claude-deepseek

  - role: implementer
    name: glm-implementer
    cli: claude-code
    vendor: zai
