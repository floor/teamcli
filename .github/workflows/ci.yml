name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:00 UTC nightly: verify macOS compatibility does not rot
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Pull requests: typecheck, one build (via pack), every fast check and the signature check
  # in one job; the tests the diff can reach in parallel shards. See scripts/ci-select-tests.ts.
  # Pushes to main (merge time), the nightly schedule and workflow_dispatch run the static
  # stages once per system in `static` and the whole suite in parallel as six shards per
  # system in `full-tests`, so anything the selection misses is caught there.
  checks:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `team check` reads the history; the PR test selection diffs against the base
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The release's tarball guard, on every run, so the real path is
      # exercised before any tag. The filename and SHA256 come from the pack
      # script's own JSON line, never a glob. The pack builds dist/ (the only build in this job) and is stamped with the
      # commit this run checked out: scripts/pack.ts refuses a dirty tree, an
      # uncommitted version or an unpinned compressor, and writes the full HEAD
      # SHA into the tarball's manifest. The gzip frame is fixed, so this SHA256
      # is the one a local pack of the same commit prints.
      - name: Pack the tarball
        id: pack
        run: |
          report="$(bun scripts/pack.ts --pack-destination .)"
          printf '%s\n' "$report"
          filename="$(printf '%s' "$report" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).tarball')"
          sha256="$(printf '%s' "$report" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).sha256')"
          test -f "$filename" || { echo "pack reported '$filename', which is not a file" >&2; exit 1; }
          echo "tarball=$filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "Reproducible tarball SHA256: $sha256"
            echo "Compressor: Node $(node --version), zlib $(node -p 'process.versions.zlib')"
            echo "Tar builder: npm $(npm --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The tarball carries its source stamp and no internal ticket reference
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: bun scripts/check-pack.ts "$TARBALL" "$GITHUB_SHA"

      - name: Every commit and the pull request body are signed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            printf '%s' "$BODY" | node dist/cli.js check "origin/$BASE..HEAD" --pr - --file .github/team.yaml
          else
            case "$BEFORE" in
              *[!0]*) node dist/cli.js check "$BEFORE..HEAD" --file .github/team.yaml ;;
              # A first push has no commit before it.
              *) node dist/cli.js check HEAD --file .github/team.yaml ;;
            esac
          fi

      - run: node dist/cli.js --version
      # The checks `bun run ci` runs after its build, each once.
      - run: bun run conformance
      - run: bun run schema:check
      - run: bun run contract:check
      - run: bun run coverage:check
      - run: bun run brief:check
      - run: bun run public-names:check
      - run: bun run exit-codes:check
      - run: bun run readme:check
      # Every tracked test file belongs to exactly one full-suite shard
      # (scripts/ci-shard-assignment.json): a test file with no shard is red, never silently
      # unrun. Every lane-classifier rule must match real tracked files.
      - run: bun run ci:shard:check
      - run: bun scripts/ci-classify-lane.ts --check

  pr-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `team check` reads the history; the PR test selection diffs against the base
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: bun install --frozen-lockfile
      - name: Classify lane and select the tests this diff can reach
        id: select
        env:
          BASE: ${{ github.base_ref }}
          CI_LANE_BASE_REF: origin/${{ github.base_ref }}
          CI_LANE_EVENT: ${{ github.event_name }}
        run: |
          # The classifier is read from the base revision, never from the pull request's copy,
          # and the base ref reaches it through the environment rather than a shell expansion.
          # It runs from a sibling copy so the pull request's own tests still exercise its own
          # script. A base revision that has no classifier yet (the change that introduces it)
          # stays careful, so it can never select the shallow lane for itself.
          if git show "$CI_LANE_BASE_REF:scripts/ci-classify-lane.ts" > "$RUNNER_TEMP/ci-classify-lane.base.ts"; then
            cp "$RUNNER_TEMP/ci-classify-lane.base.ts" scripts/ci-classify-lane.base.ts
            lane="$(bun scripts/ci-classify-lane.base.ts --github-output "$GITHUB_OUTPUT")"
          else
            echo "ci:lane: no classifier at $CI_LANE_BASE_REF; this run stays careful"
            lane=careful
            echo "lane=careful" >> "$GITHUB_OUTPUT"
          fi
          if [ "$lane" = routine ]; then
            SELECT_DEPTH=2 bun scripts/ci-select-tests.ts --base "origin/$BASE" --github-output "$GITHUB_OUTPUT" > /dev/null
          else
            bun scripts/ci-select-tests.ts --base "origin/$BASE" --github-output "$GITHUB_OUTPUT" > /dev/null
          fi
      # The live-herdr tests skip themselves: TEAM_LIVE_UP is not set here.
      - name: Run the selected tests (shard ${{ matrix.shard }} of 6)
        env:
          BASE: ${{ github.base_ref }}
          MODE: ${{ steps.select.outputs.mode }}
          TESTS: ${{ steps.select.outputs.tests }}
          SHARD: ${{ matrix.shard }}
        # Duration-weighted split (scripts/ci-shard-tests.ts, timings in scripts/ci-test-timings.json):
        # a unit is a file, or `<file>#<i>/<n>`, part i of a file split with TEAM_EXIT_PART.
        run: |
          if git diff --name-only "origin/$BASE...HEAD" | grep -qE '^(src/broker/|src/commands/broker\.ts$|test/broker(-run|\.test)\.ts$)'; then
            export TEAM_NIGHTLY_STRESS=1
          fi
          bun scripts/ci-shard-tests.ts --plan --shards 6 > /dev/null
          mine="$(bun scripts/ci-shard-tests.ts --shard "$SHARD" --shards 6)"
          if [ -z "$mine" ]; then echo "No tests in this shard."; exit 0; fi
          echo "Shard $SHARD runs: $mine"
          files=""
          parts=""
          for t in $mine; do
            case "$t" in
              *#*) parts="$parts $t" ;;
              *) files="$files $t" ;;
            esac
          done
          status=0
          if [ -n "$files" ]; then bun test $files || status=1; fi
          for p in $parts; do
            echo "Part ${p#*#} of ${p%%#*}"
            TEAM_EXIT_PART="${p#*#}" bun test "./${p%%#*}" || status=1
          done
          exit $status

  static:
    if: github.event_name != 'pull_request'
    # Once per system: the build and every check the test shards would otherwise repeat.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # `team check` reads the history
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # The release's tarball guard, on every run, so the real path is
      # exercised before any tag. The filename and SHA256 come from the pack
      # script's own JSON line, never a glob. The pack builds dist/ (the only build in this job) and is stamped with the
      # commit this run checked out: scripts/pack.ts refuses a dirty tree, an
      # uncommitted version or an unpinned compressor, and writes the full HEAD
      # SHA into the tarball's manifest. The gzip frame is fixed, so this SHA256
      # is the one a local pack of the same commit prints.
      - name: Pack the tarball
        id: pack
        run: |
          report="$(bun scripts/pack.ts --pack-destination .)"
          printf '%s\n' "$report"
          filename="$(printf '%s' "$report" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).tarball')"
          sha256="$(printf '%s' "$report" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).sha256')"
          test -f "$filename" || { echo "pack reported '$filename', which is not a file" >&2; exit 1; }
          echo "tarball=$filename" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"
          {
            echo "Reproducible tarball SHA256: $sha256"
            echo "Compressor: Node $(node --version), zlib $(node -p 'process.versions.zlib')"
            echo "Tar builder: npm $(npm --version)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: The tarball carries its source stamp and no internal ticket reference
        env:
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: bun scripts/check-pack.ts "$TARBALL" "$GITHUB_SHA"

      - name: Every commit and the pull request body are signed
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
          BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            printf '%s' "$BODY" | node dist/cli.js check "origin/$BASE..HEAD" --pr - --file .github/team.yaml
          else
            case "$BEFORE" in
              *[!0]*) node dist/cli.js check "$BEFORE..HEAD" --file .github/team.yaml ;;
              # A first push has no commit before it.
              *) node dist/cli.js check HEAD --file .github/team.yaml ;;
            esac
          fi

      - run: node dist/cli.js --version
      # The checks `bun run ci` runs after its build, each once.
      - run: bun run conformance
      - run: bun run schema:check
      - run: bun run contract:check
      - run: bun run coverage:check
      - run: bun run brief:check
      - run: bun run public-names:check
      - run: bun run exit-codes:check
      - run: bun run readme:check
      # Every tracked test file belongs to exactly one shard of the full suite, and every
      # lane-classifier rule matches real tracked files.
      - run: bun run ci:shard:check
      - run: bun scripts/ci-classify-lane.ts --check

  full-tests:
    if: github.event_name != 'pull_request'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        shard: [0, 1, 2, 3, 4, 5]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - run: bun install --frozen-lockfile
      # The full suite is split by the checked-in assignment
      # (scripts/ci-shard-assignment.json), not recomputed at run time: a unit keeps its shard
      # when a test file is added, and --check refuses a test file that belongs to no shard.
      # A unit is a file, or `<file>#<i>/<n>`, part i of a SPLIT file run with TEAM_EXIT_PART.
      # Each run's JUnit report becomes `##[unit]<unit> <ms>` lines in this job's log, which is
      # what `ci-shard-tests.ts --record` reads back into scripts/ci-test-timings.json.
      # The live-herdr tests skip themselves: TEAM_LIVE_UP is not set here.
      - name: Run the full suite (shard ${{ matrix.shard }} of 6)
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          CI_LANE_EVENT: ${{ github.event_name }}
          CI_LANE_BEFORE_REF: ${{ github.event.before }}
          RUNNER_OS: ${{ matrix.os }}
          SHARD: ${{ matrix.shard }}
        run: |
          # The classifier comes from the commit before this push, not from the checked-out
          # tree, and the revision reaches it through the environment. It runs from a sibling
          # copy so the tree's own tests keep their own script. A first push or a revision
          # without the script stays careful.
          if [ -z "${BEFORE//0/}" ] || ! git show "$BEFORE:scripts/ci-classify-lane.ts" > "$RUNNER_TEMP/ci-classify-lane.base.ts"; then
            echo "ci:lane: no classifier at $BEFORE; this run stays careful"
            lane=careful
          else
            cp "$RUNNER_TEMP/ci-classify-lane.base.ts" scripts/ci-classify-lane.base.ts
            lane="$(bun scripts/ci-classify-lane.base.ts)"
          fi
          if [ "$RUNNER_OS" = macos-latest ] && [ "$lane" = routine ]; then
            if [ "$SHARD" = 0 ]; then
              echo "Routine lane on macOS: running CLI smoke test on shard 0."
              bun test ./test/cli-smoke.test.ts
            else
              echo "Routine lane on macOS: covered by ubuntu-latest full suite and macOS shard 0 smoke."
            fi
            exit 0
          fi
          if [ "$EVENT" = schedule ]; then
            export TEAM_NIGHTLY_STRESS=1
          elif [ "$EVENT" = push ]; then
            case "$BEFORE" in
              *[!0]*)
                if git diff --name-only "$BEFORE..HEAD" | grep -qE '^(src/broker/|src/commands/broker\.ts$|test/broker(-run|\.test)\.ts$)'; then
                  export TEAM_NIGHTLY_STRESS=1
                fi
                ;;
            esac
          fi
          bun scripts/ci-shard-tests.ts --assigned --plan
          mine="$(bun scripts/ci-shard-tests.ts --assigned --shard "$SHARD" --shards 6)"
          if [ -z "$mine" ]; then echo "No tests in this shard."; exit 0; fi
          echo "Shard $SHARD runs: $mine"
          files=""
          parts=""
          for t in $mine; do
            case "$t" in
              *#*) parts="$parts $t" ;;
              *) files="$files $t" ;;
            esac
          done
          status=0
          junit="$RUNNER_TEMP/junit.xml"
          if [ -n "$files" ]; then
            bun test --reporter=junit --reporter-outfile="$junit" $files || status=1
            bun scripts/ci-shard-tests.ts --junit "$junit"
          fi
          for p in $parts; do
            echo "Part ${p#*#} of ${p%%#*}"
            TEAM_EXIT_PART="${p#*#}" bun test "./${p%%#*}" --reporter=junit --reporter-outfile="$junit" || status=1
            bun scripts/ci-shard-tests.ts --junit "$junit" --label "$p"
          done
          exit $status

