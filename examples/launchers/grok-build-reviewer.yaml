# Grok Build, read-only reviewer seat. Measured on grok 1.0.77 (50ca579fa996) on 2026-11-11:
# reads and `team` commands ran with no prompt; a write, an edit, `git status` and `bun test`
# were each refused by the CLI's own permission policy. Only the Bun test runner was measured.
# Evidence: briefs/teamcli-notes/briefs-0.5.18/grok-build-seat-recipe.md
format: 1
name: grok-build-reviewer
kind: custom
summary: Grok Build CLI, Grok 4.7, reviewer that cannot write, edit, run git or bun
argv:
  - grok
  - --model
  - grok-4.7
  - --no-subagents
  - --permission-mode
  - dontAsk
  - --allow
  - Read
  - --allow
  - "Bash(team *)"
  - --deny
  - Write
  - --deny
  - Edit
  - --deny
  - "Bash(git *)"
  - --deny
  - "Bash(bun *)"
